function addPlan(id){
  const r=recipeById(id);if(!r)return;
  const blocked=safeFor(r);
  if(blocked.length){toast('Allergie déclarée : recette bloquée.');return;}
  mutate(s=>{
    const date=todayPlus(0);
    s.plan[date]={recipeId:id,cookId:s.selectedCook||'p2'};
    const existing=s.history.findIndex(x=>x.date===date);
    if(existing>=0)s.history[existing]={recipeId:id,date,at:Date.now()};
    else s.history.push({recipeId:id,date,at:Date.now()});
    s.history=s.history.slice(-100);
  });
  currentId=null;
  toast('Dîner choisi pour ce soir !');
}

.skill===1?'selected':''}">Débutant</button><button type="button" data-action="choose-skill" data-skill="2" class="${m.skill===2?'selected':''}">À l'aise</button></div><input type="hidden" name="skill" value="${modal.skill||m.skill}">`:''}<div class="setup-box">Une recette peut contenir des allergènes cachés ou des traces. La vérification des ingrédients reste nécessaire, même après confirmation.</div><button class="btn primary full" style="margin-top:20px" type="submit">Enregistrer le profil</button></form>`,false)}
if(modal.type==='cook'){const entry=state.plan[modal.date];html=modalBase('Qui prépare ce dîner ?',`<p class="section-body">Choisissez le parent qui cuisinera ce jour-là.</p><div class="segmented">${state.members.filter(x=>x.type==='parent').map(x=>`<button data-action="assign-cook" data-id="${x.id}" data-date="${modal.date}" class="${entry?.cookId===x.id?'selected':''}">${escapeHTML(x.name)}</button>`).join('')}</div>`,false)}
if(modal.type==='account'){html=modalBase('Compte et partage',`${mode==='cloud'?`<div class="auth-status">☁ Votre famille est synchronisée sur les appareils connectés.</div><p class="section-body">Connecté en tant que <b>${escapeHTML(me?.name||me?.email||'')}</b>.</p><div class="field-group"><label class="label">Code d'invitation du foyer</label><div style="display:flex;gap:9px"><input class="field" readonly id="inviteCode" value="${escapeHTML(me?.invite_code||'')}"><button class="btn soft" data-action="copy-invite">Copier</button></div><p class="hint">L'autre parent crée son compte avec ce code pour rejoindre le même foyer.</p></div><button class="btn danger" data-action="logout">Se déconnecter</button>`:`<div class="setup-box"><b>Mode local actif.</b> Vos choix sont enregistrés sur cet appareil. Pour synchroniser les deux téléphones, lancez la version avec serveur et créez deux comptes.</div><p class="section-body">Vous pouvez dès maintenant tester l'ensemble des recettes, profils et plannings.</p><button class="btn soft full" data-action="export">Exporter les données de la famille ↓</button><div style="height:10px"></div><label class="btn full" style="cursor:pointer">Importer des données <input type="file" id="importFile" accept="application/json" style="display:none"></label><div style="height:12px"></div><button class="btn primary full" data-action="open-auth" ${!window.ONMANGE_SERVER?'disabled title="Nécessite le serveur inclus dans le projet"':''}>Activer le partage entre deux comptes</button>`}`,false)}

function openModal(type,id){modal={type,id};renderModal();}

function clickHandler(e){if(e.target.closest('.modal')===null&&e.target.closest('[data-action="close-bg"]')){closeModal();return;}const btn=e.target.closest('button,[data-action]:not(.floating),[data-page],[data-day],[data-kind]');if(!btn)return;const p=btn.dataset.page; if(p){changePage(p);return;}if(btn.dataset.day!==undefined&&!btn.dataset.action){selectedDay=+btn.dataset.day;currentId=null;render();return;}if(btn.dataset.kind){catalogKind=btn.dataset.kind;searchTerm='';render();return;}const action=btn.dataset.action;if(!action)return;e.preventDefault();e.stopPropagation();switch(action){case'close-modal':closeModal();break;case'account':openModal('account');break;case'recipe':openModal('recipe',btn.dataset.id);break;case'edit-profile':openModal('profile',btn.dataset.id);break;case'favourite':toggleFav(btn.dataset.id);break;case'skip':skip();break;case'change-today':mutate(s=>{delete s.plan[todayPlus(0)]});currentId=null;render();toast('Choisissons une autre idée.');break;case'variant':nextRecipe(recipeById(currentId)?.category);break;case'plan':addPlan(btn.dataset.id);if(modal?.type==='recipe')closeModal();break;case'target-day':selectedDay=+btn.dataset.day;changePage('discover');break;case'unplan':mutate(s=>{delete s.plan[btn.dataset.date]});toast('Repas retiré du planning.');break;case'set-cook':modal={type:'cook',date:btn.dataset.date};renderModal();break;case'assign-cook':mutate(s=>{if(s.plan[btn.dataset.date])s.plan[btn.dataset.date].cookId=btn.dataset.id});closeModal();toast('Cuisinier mis à jour.');break;case'rate':rate(btn.dataset.id,btn.dataset.rate);break;case'choose-skill':modal.skill=+btn.dataset.skill;const skill=$('#profileForm [name=skill]');if(skill)skill.value=modal.skill;$all('[data-action=choose-skill]').forEach(el=>el.classList.toggle('selected',el.dataset.skill===String(modal.skill)));break;case'copy-invite':navigator.clipboard?.writeText(me.invite_code);toast('Code copié.');break;case'export':exportState();break;case'logout':logout();break;case'open-auth':authType='login';authError='';openModal('auth');break;case'auth-type':authType=btn.dataset.val;authError='';renderModal();break;}}
async function submitHandler(e){const f=e.target;if(f.id==='profileForm'){e.preventDefault();const data=new FormData(f),id=f.dataset.id;const likes=split(data.get('likes')),dislikes=split(data.get('dislikes')),allergies=split(data.get('allergies'));const name=String(data.get('name')||'').trim();if(!name)return;await mutate(s=>{const m=s.members.find(x=>x.id===id);if(!m)return;m.name=name;m.age=String(data.get('age')||'').slice(0,3);m.likes=likes;m.dislikes=dislikes;m.allergies=allergies;m.allergiesConfirmed=data.has('confirmAllergies');m.skill=+data.get('skill')||m.skill;});modal=null;render();toast('Profil enregistré.');currentId=null;return;}
if(f.id==='authForm'){e.preventDefault();const data=new FormData(f);try{let res=await fetch('/api/auth/'+(authType==='signup'?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({email:String(data.get('email')||'').trim(),password:data.get('password'),name:data.get('name'),invite:String(data.get('invite')||'').trim()})});let v=await res.json();if(!res.ok)throw Error(v.error||'Connexion impossible');mode='cloud';me=v.user;version=v.version||0;state=makeState(v.state);saveLocal();modal=null;page='discover';render();toast('Bienvenue dans votre foyer partagé.')}catch(err){authError=err.message;renderModal();}}}

async function changeHandler(e){if(e.target.id==='importFile'){const f=e.target.files?.[0];if(!f)return;try{const parsed=JSON.parse(await f.text());const data=makeState(parsed.state||parsed);if(!Array.isArray(data.members)||data.members.length!==6)throw Error('Invalide');state=data;saveLocal();modal=null;currentId=null;render();toast('Les données ont été importées.')}catch(e){toast('Ce fichier ne contient pas une sauvegarde valide.');}}}

  }
  family=function(){
    const total=state.members.reduce((n,m)=>n+count(m.id,foods),0);
    return `<div class="pf-page"><div class="pf-title"><span class="pf-kicker">★ DOSSIER SECRET · LA SUPER FAMILLE ★</span><h1>LES <em>SUPER-GOÛTS</em></h1><p>Un aliment, un avis : des repas qui plaisent à la maison.</p></div>
    <nav class="pf-tabs" aria-label="Préférences"><button class="${view==='cards'?'active':''}" data-pf="view" data-value="cards">✦ CARTES</button><button class="${view==='matrix'?'active':''}" data-pf="view" data-value="matrix">▦ TABLEAU</button><button class="${view==='profiles'?'active':''}" data-pf="view" data-value="profiles">⚙ PROFILS</button></nav>
    ${view==='cards'?cards():view==='matrix'?matrix():profiles()}
    ${view==='cards'&&total===0?`<aside class="pf-fireflies"><div><b>À PARTIR DU FIREFLIES</b><p>Indices non confirmés : Benoît aimerait pâtes, steak, tomates et oignons ; le premier enfant aimerait les pâtes.</p></div><button data-pf="import">IMPORTER 5 INDICES À VÉRIFIER</button></aside>`:''}
    <button class="pf-back" data-page="discover">← RETOUR AU DÎNER DU JOUR</button></div>`;
  };
  const oldClick=clickHandler;
  clickHandler=function(e){
    const b=e.target.closest('[data-pf]');
    if(!b)return oldClick(e);
    e.preventDefault();e.stopPropagation();
    const a=b.dataset.pf;
    if(a==='view'){view=b.dataset.value;render()}
    else if(a==='person'){person=b.dataset.id;seek();render()}
    else if(a==='extend'){extended=!extended;seek();render()}
    else if(a==='vote'){const f=list()[index];if(f){set(person,f.id,b.dataset.value);index=Math.min(index+1,list().length);render()}}
    else if(a==='skip'){index=Math.min(index+1,list().length);render()}
    else if(a==='prev'){index=Math.max(0,index-1);render()}
    else if(a==='restart'){index=0;render()}
    else if(a==='next-person'){const i=state.members.findIndex(m=>m.id===person);person=state.members[(i+1)%6].id;seek();render()}
    else if(a==='cell'){const v=get(b.dataset.person,b.dataset.food);set(b.dataset.person,b.dataset.food,v===''?'like':v==='like'?'dislike':v==='dislike'?'depends':'')}
    else if(a==='import'){mutate(s=>{if(!s.foodPrefs)s.foodPrefs={};for(const [m,f] of [['p1','pates'],['p1','steak'],['p1','tomates'],['p1','oignons'],['p3','pates']]){if(!s.foodPrefs[m])s.foodPrefs[m]={};if(!s.foodPrefs[m][f])s.foodPrefs[m][f]='like'}});seek();toast('Cinq indices ajoutés, à vérifier dans le tableau.');render()}
  };
})();
init();
</script></body></html>
