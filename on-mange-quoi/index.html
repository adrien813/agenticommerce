let appState={foodPrefs:structuredClone(DEFAULT),chosen:{},passes:{},likes:{},feedback:[],history:[]};

function announce(msg){$('#toast').textContent=msg;$('#toast').style.display='block';setTimeout(()=>{if($('#toast'))$('#toast').style.display='none'},3000)}
async function api(action,payload={}){const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,code,...payload})});const out=await res.json();if(!res.ok){const e=new Error(out.error||'Erreur réseau');e.status=res.status;e.data=out;throw e}return out}
function normalize(s){return {foodPrefs:s?.foodPrefs||structuredClone(DEFAULT),chosen:s?.chosen||{},passes:s?.passes||{},likes:s?.likes||{},feedback:Array.isArray(s?.feedback)?s.feedback:[],history:Array.isArray(s?.history)?s.history:[]}}
async function connect(c){code=c.trim().toUpperCase();loading=true;draw();try{let out=await api('read');appState=normalize(out.state);ver=out.version;connected=true;localStorage.setItem('onmange-family-code',code);screen='home';loadDeck();loading=false;draw()}catch(e){connected=false;loading=false;draw();announce('Code incorrect ou connexion indisponible')}}
async function refresh(){if(!connected||busy||activeModal||screen==='prefs')return;try{const out=await api('read');if(out.version>ver){appState=normalize(out.state);ver=out.version;draw()}}catch(e){/* retry next time */}}
function change(mutator){mutator(appState);draw();busy=true;const copy=structuredClone(appState);writeQueue=writeQueue.then(async()=>{try{for(let attempt=0;attempt<3;attempt++){try{const out=await api('save',{state:copy,version:ver});ver=out.version;return}catch(e){if(e.status===409){const fresh=await api('read');ver=fresh.version;const merged=normalize(fresh.state);mutator(merged);Object.assign(copy,merged);continue}throw e}}throw Error('Conflit de sauvegarde')}catch(e){announce('Échec de synchronisation, réessayez');console.error(e)}finally{busy=false;draw()}})}
function clean(t){return String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/œ/g,'oe').replace(/[^a-z0-9 ]/g,' ')}
const vocab={pates:/\b(pates?|spaghetti|penne|nouilles|coquillettes)\b/,poulet:/\bpoulet\b/,riz:/\b(riz|risotto)\b/,steak:/\b(steak|boeuf|hach[eé]|burger)\b/,'pommes-terre':/\b(pommes? de terre|puree|frites|grenailles)\b/,oeufs:/\b(oeufs?|omelette|tortilla)\b/,tomates:/\btomates?\b/,fromage:/\b(fromage|mozzarella|emmental|cheddar|parmesan|feta)\b/,carottes:/\bcarottes?\b/,poisson:/\b(poisson|saumon|thon|cabillaud|colin)\b/,brocolis:/\bbrocolis?\b/,courgettes:/\bcourgettes?\b/,champignons:/\bchampignons?\b/,salade:/\b(salade|laitue|roquette)\b/,oignons:/\boignons?\b/,'petits-pois':/\bpetits pois\b/,'haricots-verts':/\bharicots? verts?\b/,jambon:/\bjambon\b/,poivrons:/\bpoivrons?\b/,lentilles:/\blentilles?\b/};
function dishPrefs(r){const t=clean(r.ingredients.join(' '));return FOODS.filter(([id])=>vocab[id]?.test(t)).map(([id])=>id)}
function suitability(r){const ids=dishPrefs(r);let dislikes=0,likes=0;for(let p=1;p<=6;p++)for(const id of ids){const vote=appState.foodPrefs?.['p'+p]?.[id];if(vote==='dislike')dislikes++;if(vote==='like')likes++}return {likes,dislikes}}
function sorted(){return RECIPES.map(r=>({r,fit:suitability(r)})).sort((a,b)=>(a.fit.dislikes-b.fit.dislikes)||(b.fit.likes-a.fit.likes)||((appState.passes?.[a.r.id]||0)-(appState.passes?.[b.r.id]||0))||(a.r.time-b.r.time)).map(o=>o.r)}
const DECK_KEY='onmange-daily-recipe-history-v1';
function saveDeck(){try{localStorage.setItem(DECK_KEY,JSON.stringify(deck))}catch(e){}}
function loadDeck(){
  deck={day:date(),ids:[],position:0,passed:[]};
  try{
    const saved=JSON.parse(localStorage.getItem(DECK_KEY)||'null');
    if(saved&&saved.day===date()&&Array.isArray(saved.ids)){
      const known=new Set(RECIPES.map(r=>r.id));
      const ids=[...new Set(saved.ids)].filter(id=>known.has(id));
      deck={day:date(),ids,position:Math.min(ids.length,Math.max(0,Number(saved.position)||0)),passed:Array.isArray(saved.passed)?saved.passed.filter(id=>ids.includes(id)):[]};
    }
  }catch(e){}
}
function ensureDeck(){
  if(deck.day!==date())loadDeck();
  if(!deck.ids.length){
    const avoid=new Set((appState.history||[]).slice(-8).map(x=>x.id));
    deck.ids=sorted().filter(r=>!avoid.has(r.id)).slice(0,5).map(r=>r.id);
    saveDeck();
  }
}
function current(){ensureDeck();return RECIPES.find(r=>r.id===deck.ids[deck.position])||null}
function previous(){if(deck.position>0){deck.position--;saveDeck();draw()}}
function revisit(i){if(Number.isInteger(i)&&i>=0&&i<deck.ids.length){deck.position=i;saveDeck();draw()}}
function moreRecipes(){
  ensureDeck();
  const avoid=new Set([...(appState.history||[]).slice(-8).map(x=>x.id),...deck.ids]);
  const additions=sorted().filter(r=>!avoid.has(r.id)).slice(0,5).map(r=>r.id);
  if(!additions.length){announce('Toutes les recettes disponibles ont été consultées');return}
  deck.position=deck.ids.length;
  deck.ids.push(...additions);
  saveDeck();draw();
}
function historyNav(){
  if(deck.ids.length<2)return '';
  return '<details class="history"><summary>Revoir les idées du jour ('+deck.ids.length+')</summary><div class="history-list">'+deck.ids.map((id,i)=>{const r=RECIPES.find(x=>x.id===id);return r?'<button type="button" data-act="revisit" data-index="'+i+'" aria-current="'+(i===deck.position)+'">'+(i+1)+'. '+esc(r.emoji)+' '+esc(r.name)+'</button>':''}).join('')+'</div></details>';
}
function colors(r){const c=r.category||'';return /pâte/i.test(c)?'pasta':/riz/i.test(c)?'rice':/poisson/i.test(c)?'fish':/viande/i.test(c)?'meat':/compos/i.test(c)?'composer':''}

function home(){const day=date(),choice=appState.chosen?.[day],r=RECIPES.find(x=>x.id===choice),candidate=current();return header()+'<div class="eyebrow">Notre dîner du jour</div><h1 class="heading">On mange quoi<br>ce soir ?</h1><p class="sub">Une idée à la fois. À vous de choisir.</p>'+ (choice&&r?'<div class="chosen"><div style="font-size:50px">'+esc(r.emoji)+'</div><h2>'+esc(r.name)+'</h2><p>Le dîner de ce soir est choisi !</p><div class="row" style="justify-content:center"><button class="secondary" data-act="details" data-id="'+esc(r.id)+'">Voir la recette</button><button class="secondary" data-act="unchoose">Changer de plat</button></div></div>':candidate?'<article class="card"><div class="art '+colors(candidate)+'" id="swipeCard"><span class="counter">Idée '+(deck.position+1)+' sur '+deck.ids.length</span><span class="dish-emoji">'+esc(candidate.emoji)+'</span><span id="swipeMark"></span></div><div class="food-detail"><h2 class="food-title">'+esc(candidate.name)+'</h2><div class="meta"><span>◷ '+candidate.time+' min</span><span>Pour 6 personnes</span><span>Facile</span></div><div class="reasons">'+(suitability(candidate).dislikes===0?'Aucun ingrédient explicitement refusé dans les préférences connues.':'Ce plat pourrait demander quelques adaptations aux goûts de la famille.')+'</div><button class="back" data-act="details" data-id="'+esc(candidate.id)+'" style="margin-top:12px">Voir les ingrédients et la recette →</button></div></article>'+(deck.position>0?'<div class="nav-back"><button class="back" data-act="previous">← Recette précédente</button></div>':'')+'<div class="cta"><button class="btn no" data-act="pass">✕ Suivant</button><button class="btn yes" data-act="choose" data-id="'+esc(candidate.id)+'">♥ On prend !</button></div><p class="tiny">Glisser à gauche pour passer · à droite pour choisir</p>':'<div class="box"><h2>'+deck.ids.length+' idées consultées</h2><p>Vous pouvez revoir une recette ou découvrir cinq autres idées.</p><div class="row">'+(deck.position>0?'<button class="secondary" data-act="previous">← Recette précédente</button>':'')+'<button class="secondary" data-act="more">Voir cinq autres idées</button></div></div>')+historyNav()+'<div class="sync">'+(connected?'✓ Préférences partagées · '+(busy?'Sauvegarde…':'Enregistré'):'Connexion nécessaire')+'</div><div class="feedback-toggle"><button data-act="feedback">Une remarque ou une idée ?</button></div>'+footer()}

function access(){return header()+'<div class="eyebrow">Une seule fois par téléphone</div><h1 class="heading">Bienvenue<br>à la maison.</h1><p class="sub">Entrez le mot de passe familial pour retrouver les mêmes idées et préférences sur tous les appareils. Aucun compte nécessaire.</p><div class="box"><label class="label" for="familyCode">Mot de passe de la famille</label><input id="familyCode" class="field" autocomplete="off" maxlength="16" placeholder="Mot de passe de la famille" value="'+esc(code)+'"><button class="btn yes" data-act="connect" style="width:100%;margin-top:15px">'+(loading?'Connexion…':'Commencer')+'</button></div><p class="notice">Ce mot de passe est conservé uniquement sur ce téléphone. Ne le partagez qu’avec la famille.</p>'}
function showDialog(id){const r=RECIPES.find(x=>x.id===id);if(!r)return;activeModal='recipe';let content='<div class="overlay" id="overlay"><div class="modal"><button class="back" data-act="close">← Fermer</button><h2>'+esc(r.emoji)+' '+esc(r.name)+'</h2><div class="meta">'+r.time+' minutes · 6 personnes</div><h3>Ingrédients</h3><ul>'+r.ingredients.map(x=>'<li class="step">'+esc(x)+'</li>').join('')+'</ul><h3>Préparation</h3><ol>'+r.steps.map(x=>'<li class="step">'+esc(x)+'</li>').join('')+'</ol><p class="notice">Vérifier les ingrédients et les allergènes avant de préparer ce plat.</p><button class="secondary" data-act="close" style="width:100%">Terminer</button></div></div>';document.body.insertAdjacentHTML('beforeend',content)}
function feedbackDialog(){activeModal='feedback';document.body.insertAdjacentHTML('beforeend','<div class="overlay"><div class="modal"><button class="back" data-act="close">← Fermer</button><h2>Une remarque ?</h2><p class="muted">Qu’est-ce qu’on peut améliorer ?</p><textarea id="feedbackText" class="field" rows="5" placeholder="Votre idée, un problème, une recette qui manque…"></textarea><button data-act="send-feedback" class="btn yes" style="width:100%;margin-top:12px">Envoyer mon avis</button></div></div>')}
function draw(){if(activeModal)return;$('#app').innerHTML=!connected?access():screen==='prefs'?preferences():home();if(connected&&screen==='home')setupSwipe()}
function close(){document.querySelector('.overlay')?.remove();activeModal='';draw()}
function pass(){const r=current();if(!r)return;const firstPass=!deck.passed.includes(r.id);if(firstPass)deck.passed.push(r.id);deck.position++;saveDeck();if(firstPass)change(s=>{s.passes[r.id]=(s.passes[r.id]||0)+1});else draw()}
function choose(id){change(s=>{s.chosen[date()]=id;s.history=[...(s.history||[]),{id,date:date()}].slice(-35);s.likes[id]=(s.likes[id]||0)+1});announce('Repas choisi !')}
function setupSwipe(){const el=$('#swipeCard');if(!el)return;let startX=null,startY=0;el.addEventListener('pointerdown',e=>{startX=e.clientX;startY=e.clientY});el.addEventListener('pointerup',e=>{if(startX===null)return;let x=e.clientX-startX,y=e.clientY-startY;startX=null;if(Math.abs(x)>70&&Math.abs(x)>Math.abs(y)*1.5){if(x<0)pass();else if(current())choose(current().id)}})}
function makeCsv(){const cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';return [['Aliment',...PEOPLE],...FOODS.map(([id,name])=>[name,...PEOPLE.map((_,i)=>({like:'Aime',dislike:"N’aime pas",depends:'Ça dépend'}[appState.foodPrefs?.['p'+(i+1)]?.[id]]||'Non renseigné'))])].map(row=>row.map(cell).join(';')).join('\r\n')}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;
if(act==='connect'){const input=$('#familyCode');if(input)await connect(input.value)}
else if(act==='prefs'){screen='prefs';draw()}
else if(act==='home'){screen='home';draw()}
else if(act==='pass'){pass()}
else if(act==='previous'){previous()}
else if(act==='revisit'){revisit(Number(b.dataset.index))}
else if(act==='more'){moreRecipes()}
else if(act==='choose'){choose(b.dataset.id)}
else if(act==='unchoose'){change(s=>{delete s.chosen[date()]})}
else if(act==='details'){showDialog(b.dataset.id)}
else if(act==='close'){close()}
else if(act==='feedback'){feedbackDialog()}
else if(act==='send-feedback'){const msg=$('#feedbackText')?.value.trim();if(!msg){announce('Saisissez une remarque');return}change(s=>{s.feedback=[...(s.feedback||[]),{at:new Date().toISOString(),message:msg}].slice(-100)});close();announce('Merci, avis enregistré !')}
else if(act==='vote'){const {person,food}=b.dataset;change(s=>{const prev=s.foodPrefs?.[person]?.[food]||'';if(!s.foodPrefs[person])s.foodPrefs[person]={};s.foodPrefs[person][food]=({'':'like',like:'dislike',dislike:'depends',depends:''})[prev]})}
else if(act==='csv'){try{await navigator.clipboard.writeText(makeCsv());announce('Tableau copié, collez-le dans WhatsApp')}catch(e){announce('Impossible de copier depuis ce navigateur')}}
});
setInterval(refresh,20000);if(code)connect(code);else {loading=false;draw()}
</script></body></html>
