ors du feu pour la faire légèrement fondre."], "category": "Pâtes", "allergens": ["gluten", "lait"], "equipment": ["Grande poêle antiadhésive ou sauteuse de 28 à 30 cm avec couvercle", "Grande casserole"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ."}, {"id": "r40", "name": "Poulet au citron et couscous", "emoji": "🍋", "time": 40, "level": 1, "ingredients": ["750 g de poulet", "450 g de semoule de couscous précuite", "1 citron", "2 courgettes facultatives", "1 c. à café de paprika doux", "1 à 2 c. à soupe d’huile pour la cuisson", "Sel et poivre selon les goûts"], "steps": ["Couper le poulet en morceaux de 2 cm. Si vous utilisez les courgettes, les laver et les couper en petits dés. Prélever le jus d’un demi-citron.", "Chauffer 1 cuillère à soupe d’huile dans une poêle. Faire dorer le poulet 5 minutes à feu moyen, puis ajouter le paprika, le citron et 10 cl d’eau.", "Couvrir et laisser frémir 8 à 10 minutes à feu doux, jusqu’à cuisson complète du poulet à cœur. Ajouter un peu d’eau si la sauce s’évapore trop.", "Verser la semoule dans un saladier avec le volume d’eau bouillante salée indiqué sur le paquet. Couvrir 5 minutes puis séparer les grains à la fourchette.", "Poêler les courgettes à part avec un peu d’huile pendant 8 à 10 minutes à feu moyen, sans couvercle, si souhaité. Servir chaque élément séparément avec le reste du citron. Vérifier la volaille à cœur : 75 °C pendant 30 secondes avec une sonde propre ; les durées varient selon l’épaisseur."], "category": "Poulet", "allergens": ["gluten"], "equipment": ["Grande poêle antiadhésive ou sauteuse de 28 à 30 cm avec couvercle", "Grande casserole", "Petite casserole ou seconde poêle pour les garnitures séparées", "Saladier résistant à la chaleur et assiette pour couvrir"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ.", "safetySources": ["https://www.gov.uk/food-hygiene-businesses/cooking"]}, {"id": "r41", "name": "Tortilla espagnole", "emoji": "🍳", "time": 90, "level": 2, "ingredients": ["10 oeufs", "1,2 kg de pommes de terre", "1 oignon", "3 c. à soupe d'huile d'olive", "Sel et poivre selon les goûts"], "steps": ["Éplucher les pommes de terre et les couper en rondelles fines de 3 mm. Émincer l’oignon. Diviser tous les ingrédients en deux pour réaliser deux tortillas successives dans une poêle de 24 à 28 cm ; servir trois portions par tortilla.", "Chauffer la moitié de l’huile à feu moyen doux dans une grande poêle antiadhésive. Ajouter la moitié des pommes de terre et de l’oignon et 5 cl d’eau. Couvrir 18 à 22 minutes, en remuant régulièrement, jusqu’à tendreté. Utiliser la moitié des ingrédients pour cette première tortilla.", "Battre la moitié des œufs dans un saladier avec une pincée de sel. Ajouter les pommes de terre tièdes et mélanger doucement.", "Remettre le mélange dans la poêle à feu doux. Couvrir et cuire 8 à 10 minutes, jusqu’à ce que le dessus soit presque pris.", "Faire glisser sur une assiette, retourner prudemment dans la poêle et cuire encore 3 à 5 minutes. Si le retournement est difficile, finir à couvert à feu très doux jusqu’à prise complète. Recommencer avec les ingrédients restants. Deux poêles permettent une cuisson simultanée."], "category": "Express", "allergens": ["oeufs"], "equipment": ["Grande poêle antiadhésive ou sauteuse de 28 à 30 cm avec couvercle"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ."}, {"id": "r42", "name": "Filet de colin croustillant", "emoji": "🐟", "time": 45, "level": 2, "ingredients": ["6 filets de colin de 125 à 150 g chacun", "2 oeufs", "100 g de chapelure", "400 g de riz", "1 citron", "1 à 2 c. à soupe d’huile pour la cuisson", "Sel et poivre selon les goûts"], "steps": ["Cuire le riz dans une casserole selon les instructions du paquet. Éponger les filets de poisson ; s’ils sont surgelés, les décongeler au réfrigérateur selon le paquet avant de les paner.", "Battre les œufs dans une assiette creuse et verser la chapelure dans une autre. Passer les filets dans l’œuf puis dans la chapelure en pressant légèrement.", "Chauffer 2 cuillères à soupe d’huile dans une poêle à feu moyen. Déposer les filets sans les superposer et cuire 4 à 5 minutes sur la première face.", "Retourner délicatement et cuire encore 3 à 5 minutes selon l’épaisseur. Le poisson doit être opaque à cœur et se détacher facilement ; prolonger à feu doux si nécessaire. Prévoir deux tournées de trois portions dans une grande poêle ; ces durées s’appliquent à chaque tournée. Servir au fur et à mesure, ou utiliser deux poêles.", "Servir avec le riz et le citron en quartiers. Jeter les restes d’œuf et de chapelure qui ont touché le poisson cru. Vérifier et retirer les arêtes avant de servir."], "category": "Poisson", "allergens": ["gluten", "oeufs", "poisson"], "equipment": ["Grande poêle antiadhésive ou sauteuse de 28 à 30 cm avec couvercle", "Grande casserole"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ."}, {"id": "r43", "name": "Macaronis au fromage", "emoji": "🧀", "time": 30, "level": 1, "ingredients": ["500 g de macaronis", "30 g de beurre", "30 g de farine", "45 cl de lait", "170 g de cheddar", "Sel et poivre selon les goûts"], "steps": ["Râper le cheddar. Porter une grande casserole d’eau salée à ébullition et cuire les macaronis selon le temps du paquet.", "Dans une seconde casserole, faire fondre le beurre à feu doux. Ajouter la farine et mélanger async function api(action,payload={}){const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,code,...payload})});const out=await res.json();if(!res.ok){const e=new Error(out.error||'Erreur réseau');e.status=res.status;e.data=out;throw e}return out}

async function connect(c){code=c.trim().toUpperCase();loading=true;draw();try{let out=await api('read');appState=normalize(out.state);ver=out.version;connected=true;localStorage.setItem('onmange-family-code',code);screen='home';loadDeck();loading=false;draw()}catch(e){connected=false;loading=false;draw();announce('Code incorrect ou connexion indisponible')}}

function clean(t){return String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/œ/g,'oe').replace(/[^a-z0-9 ]/g,' ')}
const vocab={pates:/\b(pates?|spaghetti|penne|nouilles|coquillettes)\b/,poulet:/\bpoulet\b/,riz:/\b(riz|risotto)\b/,steak:/\b(steak|boeuf|hach[eé]|burger)\b/,'pommes-terre':/\b(pommes? de terre|puree|frites|grenailles)\b/,oeufs:/\b(oeufs?|omelette|tortilla)\b/,tomates:/\btomates?\b/,fromage:/\b(fromage|mozzarella|emmental|cheddar|parmesan|feta)\b/,carottes:/\bcarottes?\b/,poisson:/\b(poisson|saumon|thon|cabillaud|colin)\b/,brocolis:/\bbrocolis?\b/,courgettes:/\bcourgettes?\b/,champignons:/\bchampignons?\b/,salade:/\b(salade|laitue|roquette)\b/,oignons:/\boignons?\b/,'petits-pois':/\bpetits pois\b/,'haricots-verts':/\bharicots? verts?\b/,jambon:/\bjambon\b/,poivrons:/\bpoivrons?\b/,lentilles:/\blentilles?\b/};
function dishPrefs(r){const t=clean(r.ingredients.join(' '));return FOODS.filter(([id])=>vocab[id]?.test(t)).map(([id])=>id)}
function suitability(r){const ids=dishPrefs(r);let dislikes=0,likes=0;for(let p=1;p<=6;p++)for(const id of ids){const vote=appState.foodPrefs?.['p'+p]?.[id];if(vote==='dislike')dislikes++;if(vote==='like')likes++}return {likes,dislikes}}
function sorted(){return RECIPES.map(r=>({r,fit:suitability(r)})).sort((a,b)=>(a.fit.dislikes-b.fit.dislikes)||(b.fit.likes-a.fit.likes)||((appState.passes?.[a.r.id]||0)-(appState.passes?.[b.r.id]||0))||(a.r.time-b.r.time)).map(o=>o.r)}
const DECK_KEY='onmange-daily-recipe-history-v1';
function saveDeck(){try{localStorage.setItem(DECK_KEY,JSON.stringify(deck))}catch(e){}}
function loadDeck(){
  deck={day:date(),ids:[],position:0,passed:[]};
  try{
    const saved=JSON.parse(localStorage.getItem(DECK_KEY)||'null');
    if(saved&&saved.day===date()&&Array.isArray(saved.ids)){
      const known=new Set(RECIPES.map(r=>r.id));
      const ids=[...new Set(saved.ids)].filter(id=>known.has(id));
      deck={day:date(),ids,position:Math.min(ids.length,Math.max(0,Number(saved.position)||0)),passed:Array.isArray(saved.passed)?saved.passed.filter(id=>ids.includes(id)):[]};
    }
  }catch(e){}
}
function ensureDeck(){
  if(deck.day!==date())loadDeck();
  if(!deck.ids.length){
    const avoid=new Set((appState.history||[]).slice(-8).map(x=>x.id));
    deck.ids=sorted().filter(r=>!avoid.has(r.id)).slice(0,5).map(r=>r.id);
    saveDeck();
  }
}
function current(){ensureDeck();return RECIPES.find(r=>r.id===deck.ids[deck.position])||null}
function previous(){if(deck.position>0){deck.position--;saveDeck();draw()}}
function revisit(i){if(Number.isInteger(i)&&i>=0&&i<deck.ids.length){deck.position=i;saveDeck();draw()}}
function moreRecipes(){
  ensureDeck();
  const avoid=new Set([...(appState.history||[]).slice(-8).map(x=>x.id),...deck.ids]);
  const additions=sorted().filter(r=>!avoid.has(r.id)).slice(0,5).map(r=>r.id);
  if(!additions.length){announce('Toutes les recettes disponibles ont été consultées');return}
  deck.position=deck.ids.length;
  deck.ids.push(...additions);

}

const PANTRY_ALIASES = [  ['lait de coco',/\b(lait|creme) de coco\b/],['crème',/\bcreme\b/],  ['riz',/\b(riz|risotto)\b/],['pâtes',/\b(pates?|spaghetti|penne|pennes|coquillettes|macaronis?|lasagnes?)\b/],  ['nouilles',/\bnouilles?\b/],['poulet',/\bpoulet\b/],['dinde',/\bdinde\b/],  ['bœuf',/\b(boeuf|steaks?|viande hachee)\b/],['pommes de terre',/\b(pommes? de terre|grenailles?|patates?)\b/],  ['œufs',/\boeufs?\b/],['tomates',/\b(tomates?|coulis|passata)\b/],  ['fromage frais',/\bfromage frais\b/],['mozzarella',/\bmozzarella\b/],['parmesan',/\bparmesan\b/],  ['ricotta',/\bricotta\b/],['cheddar',/\bcheddar\b/],['fromage',/\b(fromage|emmental|gruyere)\b/],  ['carottes',/\bcarottes?\b/],['saumon fumé',/\bsaumon fume\b/],['saumon',/\bsaumon\b/],  ['thon',/\bthon\b/],['poisson',/\b(poisson|colin|cabillaud|merlu)\b/],  ['courgettes',/\bcourgettes?\b/],['champignons',/\bchampignons?\b/],['salade',/\b(salade|laitue)\b/],  ['oignons',/\boignons?\b/],['petits pois',/\bpetits pois\b/],['jambon',/\bjambon\b/],  ['poivrons',/\bpoivrons?\b/],['lentilles',/\blentilles?\b/],['haricots rouges',/\bharicots? rouges?\b/],  ['tortillas',/\btortillas?\b/],['pita',/\bpitas?\b/],['pain burger',/\b(pains? burger|buns?)\b/],  ['pain',/\b(pain|tartines?)\b/],['galettes de sarrasin',/\b(galettes?|sarrasin)\b/],  ['semoule',/\b(semoule|couscous)\b/],['gnocchis',/\bgnocchis?\b/],['ravioles',/\braviol(es?|is?)\b/],  ['sauce soja',/\b(soja|soy)\b/],['yaourt',/\b(yaourts?|yogourts?)\b/],['beurre',/\bbeurre\b/],  ['lait',/\blait\b/],['chapelure',/\bchapelure\b/],['farine',/\bfarine\b/],['citron',/\bcitrons?\b/],  ['maïs',/\bmais\b/],['avocat',/\bavocats?\b/],['lardons',/\blardons?\b/],['saucisses',/\bsaucisses?\b/],  ['pesto',/\bpesto\b/],['bouillon',/\bbouillon\b/],['miel',/\bmiel\b/],['ail',/\bail\b/],  ['eau',/\beau\b/],['huile',/\bhuile\b/],['sésame',/\bsesame\b/],['curry',/\bcurry\b/],['origan',/\borigan\b/],  ['paprika',/\bpaprika\b/],['herbes',/\bherbes\b/],['aneth',/\baneth\b/] ]; const BASICS = new Set(['huile','sel','poivre','eau']); function pantryKey(value){const t=clean(value).trim();return PANTRY_ALIASES.find(([,rx])=>rx.test(t))?.[0]||t.replace(/^\d+(?:\s*(?:g|kg|cl|ml|l))?\s+(?:de\s+)?/,'').trim()} function parseFridge(value){return [...new Set(value.split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean).map(pantryKey).filter(Boolean))].slice(0,40)} function ingredientAvailable(ingredient){  const key=pantryKey(ingredient);  return (appState.fridge||[]).some(item=>{    const have=pantryKey(item);    if(have===key)return true;    if(have==='fromage')return ['fromage frais','mozzarella','parmesan','cheddar','ricotta'].includes(key);    if(have==='poisson')return ['thon','saumon','saumon fumé'].includes(key);    return false;  }); } function pantryFit(r){  const ingredients=r.ingredients.filter(x=>!BASICS.has(pantryKey(x))&&!/^sel et poivre/i.test(x));  const have=ingredients.filter(ingredientAvailable);  const missing=ingredients.filter(x=>!ingredientAvailable(x));  return {have,missing,total:ingredients.length,ratio:ingredients.length?have.length/ingredients.length:0}; } function sorted(){  return RECIPES.filter(r=>r.ovenRequired===false).map(r=>({r,fit:suitability(r),pantry:pantryFit(r)})).sort((a,b)=>   (appState.fridge.length ? (b.pantry.ratio-a.pantry.ratio)||(b.pantry.have.length-a.pantry.have.length):0)||   (a.fit.dislikes-b.fit.dislikes)||(b.fit.likes-a.fit.likes)||   ((appState.passes?.[a.r.id]||0)-(appState.passes?.[b.r.id]||0))||(a.r.time-b.r.time)  ).map(o=>o.r); } function fridgeSummary(){const items=appState.fridge||[];return '<div class="fridge-bar"><div><strong>Dans mon frigo</strong><p>'+esc(items.length?items.slice(0,4).join(', ')+(items.length>4?'…':''):'Ajouter ce qu’il reste à cuisiner')+'</p></div><button class="secondary" data-act="fridge">'+(items.length?'Modifier':'Ajouter')+'</button></div>'} function fridgeDialog(){  activeModal='fridge';  openModal('<h2>Dans mon frigo</h2><p class="muted">Ajoutez aussi les placards : les rec async function flushChanges(){
 if(busy||!pendingChanges.length)return;busy=true;syncError=false;draw();
 try{while(pendingChanges.length){const op=pendingChanges[0];let saved=false;
  for(let attempt=0;attempt<3&&!saved;attempt++){
   const fresh=await api('read');ver=fresh.version;serverState=normalize(fresh.state);
   if(serverState._appliedClientOperations?.includes(op.id)){pendingChanges.shift();saved=true;renderPending();break;}

   next._appliedClientOperations=[...(next._appliedClientOperations||[]),op.id].slice(-100);

  }if(!saved)throw Error('Conflit de sauvegarde');
 }}catch(e){syncError=true;announce('Sauvegarde en attente. Touchez Réessayer.')}finally{busy=false;draw()}

function showDialog(id){const r=RECIPES.find(x=>x.id===id);if(!r)return;archiveVisit(id);activeModal='recipe';openModal('<h2>'+esc(r.name)+'</h2>'+photo(r,true)+'<div class="meta">Environ '+r.time+' minutes · 6 personnes · Sans four</div><p class="notice">Temps total indicatif, préparation et tournées comprises. Ajustez les quantités aux appétits.</p><p class="notice">'+esc(r.portionNote||'')+' '+esc(r.timeNote||'')+'</p><h3>Matériel</h3><p>'+r.equipment.map(esc).join(' · ')+'</p>'+adaptations(r)+'<h3>Ingrédients pour 6</h3>'+(appState.fridge.length?'<p class="notice">✓ Indiqué à la maison · À prévoir = absent de votre liste. Vérifiez les quantités et les produits exacts.</p>':'')+'<ul class="ingredients">'+r.ingredients.map(x=>'<li class="step">'+(appState.fridge.length&&!BASICS.has(pantryKey(x))&&!/^sel et poivre/i.test(x)?'<span class="availability '+(ingredientAvailable(x)?'available':'')+'">'+(ingredientAvailable(x)?'✓ À la maison':'À prévoir')+'</span>':'')+esc(x)+'</li>').join('')+'</ul><h3>Préparation pas à pas</h3><ol class="preparation">'+r.steps.map(x=>'<li class="step">'+esc(x)+'</li>').join('')+'</ol><p class="notice">Allergènes signalés : '+esc(r.allergens.length?r.allergens.join(', '):'aucun identifié dans les ingrédients de base')+'. '+esc(r.allergenNote||'')+' Vérifiez les emballages et les ingrédients ajoutés. Les goûts ne remplacent pas les précautions liées aux allergies.</p><button class="secondary" data-act="close" style="width:100%">Retour aux idées</button>')}
function feedbackDialog(){activeModal='feedback';openModal('<h2>Une remarque ?</h2><p class="muted">Qu’est-ce qu’on peut améliorer ?</p><textarea id="feedbackText" class="field" rows="5" maxlength="1500" placeholder="Votre idée, un problème, une recette qui manque…"></textarea><button data-act="send-feedback" class="btn yes" style="width:100%;margin-top:12px">Envoyer mon avis</button>')}
function close(){document.querySelector('.overlay')?.remove();document.body.style.overflow='';activeModal='';draw();if(modalOpener?.isConnected)modalOpener.focus();else if(modalOpenerAction){[...document.querySelectorAll('[data-act]')].find(el=>Object.entries(modalOpenerAction).every(([k,v])=>el.dataset[k]===v))?.focus()}}
function photo(r,modal=false){const fallback='<span class="photo-unavailable" '+(r.photo?'hidden':'')+'>'+'<span style="font-size:76px;line-height:1.2">'+esc(r.emoji)+'</span><span>Illustration du plat</span></span>';return '<figure class="dish-photo '+(modal?'detail-photo':'')+'">'+(r.photo?'<img src="'+esc(r.photo)+'" alt="Photo d’illustration : '+esc(r.photoTitle)+'" width="600" height="400" decoding="async" referrerpolicy="no-referrer">':'')+fallback+(r.photo?'<figcaption><a href="'+esc(r.photoSource)+'" target="_blank" rel="noopener noreferrer">Photo d’illustration : '+esc(r.photoTitle)+' · TheMealDB</a></figcaption>':'')+'</figure>'}
document.addEventListener('error',e=>{if(e.target.matches?.('.dish-photo img')){e.target.hidden=true;e.target.parentElement.querySelector('.photo-unavailable').hidden=false}},true);
document.addEventListener('keydown',e=>{if(!activeModal){if(e.key==='Enter'&&e.target.id==='familyCode'){e.preventDefault();connect(e.target.value)}return}if(e.key==='Escape'){e.preventDefault();close();return}if(e.key==='Tab'){const items=[...document.querySelectorAll('.modal button,.modal a,.modal textarea,.modal input,.modal summary')].filter(x=>!x.disabled&&x.getClientRects().length);if(!items.length)return;const first=items[0],last=items[items.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement===document.querySelector('.modal'))){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||!connected)return;if(b.dataset.act==='fridge')fridgeDialog();else if(b.dataset.act==='save-fridge'){const items=parseFridge($('#fridgeInput')?.value||'');change(s=>{s.fridge=items});close();announce(items.length?'Idées adaptées à votre frigo':'Toutes les idées sans four')}else if(b.dataset.act==='history-recipe')showDialog(b.dataset.id);else if(b.dataset.act==='retry-save')flushChanges()});

setInterval(refresh,20000);if(code)connect(code);else {loading=false;draw()}
</script></body></html>
