<script>
const RECIPES=[{"id": "r01", "name": "Pâtes crémeuses au poulet", "emoji": "🍝", "time": 40, "level": 1, "ingredients": ["500 g de pâtes", "750 g de poulet", "30 cl de crème", "1 oignon", "40 g de parmesan", "1 à 2 c. à soupe d’huile pour la cuisson", "Sel et poivre selon les goûts"], "steps": ["Émincer l’oignon. Couper le poulet en morceaux de 2 cm. Préparer une grande casserole et une poêle ; garder le parmesan à part pour les personnes qui n’en veulent pas. Prévoir deux tournées de poulet pour ne pas surcharger la poêle.", "Porter une grande casserole d’eau salée à ébullition. Cuire les pâtes pendant la durée du paquet, généralement 8 à 12 minutes. Prélever une tasse d’eau de cuisson avant d’égoutter.", "Chauffer 1 cuillère à soupe d’huile à feu moyen. Attendrir l’oignon 3 minutes et réserver. Cuire le poulet en deux tournées, 8 à 10 minutes chacune en retournant les morceaux, jusqu’à cuisson à cœur. Réunir le poulet cuit et l’oignon avant la crème. Réserver dès maintenant une portion de poulet sans sauce si souhaité.", "Baisser le feu, verser la crème et laisser frémir 2 à 3 minutes. Ajouter 2 à 4 cuillères à soupe d’eau de cuisson pour détendre la sauce, puis goûter et assaisonner.", "Remettre les pâtes dans la casserole égouttée, ajouter la sauce au poulet et mélanger 1 minute à feu doux. Servir le parmesan et la portion de poulet nature réservée séparément. Vérifier la volaille à cœur : 75 °C pendant 30 secondes avec une sonde propre ; les durées varient selon l’épaisseur."], "category": "Pâtes", "allergens": ["gluten", "lait"], "equipment": ["Grande poêle antiadhésive ou sauteuse de 28 à 30 cm avec couvercle", "Grande casserole"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ.", "safetySources": ["https://www.gov.uk/food-hygiene-businesses/cooking"]}, {"id": "r02", "name": "Wraps de poulet à composer", "emoji": "🌯", "time": 45, "level": 1, "ingredients": ["12 petites tortillas", "750 g de poulet", "2 tomates", "1 salade", "250 g de yaourt nature", "1 à 2 c. à soupe d’huile pour la cuisson", "1 pincée de paprika doux (facultatif)", "Quelques gouttes de citron (facultatif)", "Sel et poivre selon les goûts"], "steps": ["Couper le poulet en fines lanières. Laver les tomates et la salade ; couper les tomates en dés et essorer puis émincer la salade.", "Chauffer 1 cuillère à soupe d’huile à feu moyen dans une poêle. Ajouter le poulet et une pincée de paprika doux si souhaité. Cuire 8 à 10 minutes en remuant, jusqu’à cuisson complète à cœur. Procéder en deux tournées sans superposer les morceaux, avec la moitié de l’huile à chaque fois ; réunir ensuite le poulet cuit. La durée indiquée vaut pour chaque tournée.", "Verser le yaourt dans un bol. Ajouter une pincée de sel et, si disponible, quelques gouttes de citron ; mélanger. Disposer tomates, salade et poulet dans des bols séparés.", "Réchauffer les tortillas dans une poêle sèche 20 à 30 secondes de chaque côté, à feu moyen. Les empiler sous un torchon propre pour qu’elles restent souples.", "Déposer un peu de sauce et de garniture au centre de chaque tortilla. Rabattre le bas puis rouler. Chacun peut laisser les garnitures qu’il n’aime pas dans les bols. Vérifier la volaille à cœur : 75 °C pendant 30 secondes avec une sonde propre ; les durées varient selon l’épaisseur."], "category": "À composer", "allergens": ["gluten", "lait"], "equipment": ["Grande poêle antiadhésive ou sauteuse de 28 à 30 cm avec couvercle"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ.", "safetySources": ["https://www.gov.uk/food-hygiene-businesses/cooking"]}, {"id": "r03", "name": "Omelette pommes de terre", "emoji": "🍳", "time": 85, "level": 1, "ingredients": ["10 oeufs", "1,2 kg de pommes de terre", "1 oignon", "2 c. à soupe d'huile d'olive", "Sel et poivre selon les goûts"], "steps": ["Éplucher les pommes de terre et les couper en cubes de 1 cm. Émincer l’oignon. Battre les œufs avec une pincée de sel dans un grand saladier.", "Chauffer la moitié de l’huile à feu moyen dans une poêle antiadhésive de 28 à 30 cm. Ajouter la moitié des pommes de terre et 3 cuillères à soupe d’eau. Couvrir et cuire 15 à 18 minutes à feu moyen doux, en remuant toutes les 4 minutes.", "Piquer un cube : il doit être tendre. Si besoin, prolonger de 3 à 5 minutes avec un peu d’eau. Ajouter la moitié de l’oignon et cuire 3 minutes sans couvercle.", "Répartir les pommes de terre puis verser la moitié des œufs. Couvrir et cuire 8 à 10 minutes à feu doux jusqu’à prise complète, sans centre liquide ; baisser le feu si le dessous colore trop vite.", "Faire glisser cette première omelette sur un plat et servir trois portions. Recommencer avec les ingrédients restants pour trois autres portions. Deux poêles permettent une cuisson simultanée."], "category": "Express", "allergens": ["oeufs"], "equipment": ["Grande poêle antiadhésive ou sauteuse de 28 à 30 cm avec couvercle"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ."}, {"id": "r04", "name": "Quesadillas au fromage", "emoji": "🫓", "time": 50, "level": 1, "ingredients": ["12 petites tortillas", "300 g de fromage râpé", "2 tomates", "300 g de maïs en conserve (poids égoutté)", "250 g de yaourt nature", "Sel et poivre selon les goûts"], "steps": ["Égoutter le maïs. Couper les tomates en petits dés et enlever leur excès de jus. Répartir fromage, maïs et tomate dans trois bols.", "Garnir une moitié de chaque tortilla avec 1/12 du fromage, du maïs et de la tomate, puis replier. Déposer deux tortillas pliées dans une grande poêle antiadhésive sans les superposer.", "Replier la tortilla en deux. Chauffer à feu moyen doux 2 à 3 minutes, puis retourner avec une spatule et cuire encore 2 à 3 minutes. Le fromage doit fondre et la tortilla être dorée.", "Répéter pour les 6 tournées de deux tortillas. Servir au fur et à mesure ; réduire le feu si la tortilla brunit avant que le fromage fonde. Avec une seule tortilla à la fois, compter environ 75 minutes au total.", "Couper en triangles et servir le yaourt à part. Pour un simple refus du fromage, réserver dès le départ une tortilla garnie uniquement de maïs et de tomate ; elle sera moins liée."], "category": "À composer", "allergens": ["gluten", "lait"], "equipment": ["Grande poêle antiadhésive ou sauteuse de 28 à 30 cm avec couvercle"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ."}, {"id": "r05", "name": "Riz sauté au poulet", "emoji": "🍚", "time": 55, "level": 1, "ingredients": ["1,2 kg de riz déjà cuit (environ 400 g cru)", "600 g de poulet", "3 œufs", "2 carottes", "3 c. à soupe de sauce soja", "1 à 2 c. à soupe d’huile pour la cuisson", "Sel et poivre selon les goûts"], "steps": ["Utiliser du riz cuit refroidi rapidement, idéalement en moins d’une heure, puis réfrigéré et consommé sous 24 heures. Ne le réchauffer qu’une fois. La cuisson et le refroidissement du riz ne sont pas inclus dans la durée. Détacher les grains. Couper le poulet en dés de 2 cm et râper les carottes. Battre les trois œufs dans un bol pour pouvoir en utiliser la moitié par tournée.", "Diviser tous les ingrédients en deux parts et réaliser la recette en deux tournées. Pour chaque tournée, chauffer la moitié de l’huile dans une grande poêle à feu moyen vif et cuire la moitié du poulet 8 à 10 minutes en remuant, jusqu’à cuisson complète à cœur.", "Ajouter la moitié des carottes râpées et cuire 3 minutes. Verser 600 g de riz et le faire sauter 4 à 5 minutes en mélangeant pour le réchauffer uniformément.", "Pousser le riz sur un côté. Verser la moitié des œufs battus dans la partie libre et remuer pendant 1 à 2 minutes, jusqu’à ce qu’ils soient pris.", "Mélanger le tout et ajouter la moitié de la sauce soja. Chauffer encore 1 minute : l’ensemble doit être fumant. Servir immédiatement. Servir la première tournée puis répéter avec les ingrédients restants ; deux grandes poêles permettent une cuisson simultanée. Vérifier la volaille à cœur : 75 °C pendant 30 secondes avec une sonde propre ; les durées varient selon l’épaisseur."], "category": "Riz", "allergens": ["gluten", "oeufs", "soja"], "equipment": ["Grande poêle antiadhésive ou sauteuse de 28 à 30 cm avec couvercle", "Grande casserole"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ.", "safetySources": ["https://www.gov.uk/food-hygiene-businesses/cooking"]}, {"id": "r06", "name": "Mini pizzas pita à la poêle", "emoji": "🍕", "time": 65, "level": 1, "ingredients": ["6 pains pita", "250 g de sauce tomate", "200 g de mozzarella", "200 g de jambon", "1 c. à café d'origan", "Sel et poivre selon les goûts"], "steps": ["Couper le jambon en petits morceaux et la mozzarella en fines lamelles. Égoutter la mozzarella pour éviter de détremper les pains pita.", "Poser un pain pita dans une poêle sèche à feu doux. Étaler une fine couche de sauce tomate, puis ajouter jambon, mozzarella et une pincée d’origan.", "Verser une cuillère à café d’eau dans un espace libre de la poêle, à côté du pain. Couvrir et cuire 5 à 7 minutes à feu très doux ; vérifier le dessous après 3 minutes.", "Quand le fromage est fondu, retirer le couvercle et cuire encore 1 minute pour raffermir la base. Si le dessous colore trop vite, retirer brièvement la poêle du feu.", "Répéter pour les six pains, un à la fois (six tournées de 6 à 8 minutes) ; deux à la fois seulement s’ils tiennent sans se chevaucher. Servir au fur et à mesure ; laisser chacun choisir sa garniture."], "category": "Poêle", "allergens": ["gluten", "lait"], "equipment": ["Grande poêle antiadhésive ou sauteuse de 28 à 30 cm avec couvercle"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ."}, {"id": "r07", "name": "Boulettes de boeuf et semoule", "emoji": "🧆", "time": 45, "level": 2, "ingredients": ["750 g de boeuf haché", "450 g de semoule de couscous précuite", "1 oeuf", "400 g de tomates concassées", "1 oignon", "1 à 2 c. à soupe d’huile pour la cuisson", "Sel et poivre selon les goûts"], "steps": ["Émincer l’oignon. Mélanger le bœuf, l’œuf et une pincée de sel, puis former 18 petites boulettes de même taille pour une cuisson régulière.", "Chauffer 1 cuillère à soupe d’huile dans une sauteuse à feu moyen. Dorer les boulettes 5 minutes en les tournant délicatement, puis ajouter l’oignon pour 3 minutes. Si la viande forme une couche épaisse, la faire revenir en deux tournées, puis tout réunir avant de poursuivre.", "Ajouter les tomates concassées et 10 cl d’eau. Couvrir et laisser frémir 15 minutes à feu doux, en retournant les boulettes à mi-cuisson. Vérifier qu’elles sont cuites à cœur.", "Verser la semoule dans un saladier. Ajouter le volume d’eau bouillante salée indiqué sur le paquet. Couvrir 5 minutes, puis séparer les grains à la fourchette.", "Goûter la sauce et servir boulettes, sauce et semoule séparément. Si la sauce paraît trop épaisse, ajouter 2 cuillères à soupe d’eau chaude. La viande hachée ou la saucisse doit être cuite à cœur : repère à la sonde, 75 °C pendant 30 secondes, sans se fier uniquement à la couleur."], "category": "Viande", "allergens": ["gluten", "oeufs"], "equipment": ["Grande poêle antiadhésive ou sauteuse de 28 à 30 cm avec couvercle", "Grande casserole", "Saladier résistant à la chaleur et assiette pour couvrir"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ.", "safetySources": ["https://www.gov.uk/food-hygiene-businesses/cooking"]}, {"id": "r08", "name": "Gnocchis poêlés au pesto", "emoji": "🥔", "time": 45, "level": 1, "ingredients": ["1,2 kg de gnocchis à poêler", "6 c. à soupe de pesto", "150 g de mozzarella", "200 g de tomates cerises", "2 c. à soupe d’huile pour la cuisson (à répartir entre les trois tournées)", "Sel et poivre selon les goûts"], "steps": ["Couper les tomates cerises en quatre dans la longueur. Égoutter la mozzarella et la couper en dés. Vérifier sur le paquet que les gnocchis peuvent être poêlés directement ; sinon les précuire selon ses indications. Diviser tous les ingrédients en trois parts et réaliser la cuisson en trois tournées d’environ 400 g de gnocchis, servis au fur et à mesure.", "Chauffer un tiers de l’huile dans une grande poêle à feu moyen. Ajouter 400 g de gnocchis, idéalement en une seule couche ; ne pas superposer les gnocchis.", "Dorer 6 à 8 minutes en remuant régulièrement. Ajouter 2 cuillères à soupe d’eau, couvrir et cuire encore 2 minutes, ou suivre la durée du paquet.", "Baisser le feu et incorporer un tiers du pesto avec une cuillère à soupe d’eau. Mélanger 1 minute pour enrober les gnocchis sans brûler le pesto.", "Servir avec tomates et mozzarella à part. Le pesto contient souvent du lait et des fruits à coque : vérifier son étiquette avant de le proposer."], "category": "Express", "allergens": ["gluten", "lait", "fruits à coque"], "equipment": ["Grande poêle antiadhésive ou sauteuse de 28 à 30 cm avec couvercle", "Grande casserole"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Le pesto peut contenir des noix de cajou ou autres fruits à coque ; les gnocchis peuvent contenir des œufs. Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ."}, {"id": "r09", "name": "Croque-monsieur maison", "emoji": "🥪", "time": 40, "level": 1, "ingredients": ["12 tranches de pain de mie", "6 tranches de jambon", "200 g de fromage râpé", "30 g de beurre", "Sel et poivre selon les goûts"], "steps": ["Préparer six sandwiches avec une tranche de jambon et une portion de fromage chacun. Beurrer légèrement les faces extérieures du pain.", "Chauffer une poêle antiadhésive à feu moyen doux. Déposer un ou deux croques sans les serrer et cuire 3 à 4 minutes.", "Retourner avec une spatule. Couvrir et cuire encore 3 à 4 minutes à feu doux pour faire fondre le fromage sans brûler le pain.", "Vérifier que les deux faces sont dorées et le centre chaud. Poursuivre 1 minute à couvert si nécessaire ; cuire les autres croques de la même façon.", "Couper en deux et servir au fur et à mesure. Pour une portion sans fromage, proposer un toast au jambon séparé."], "category": "Express", "allergens": ["gluten", "lait"], "equipment": ["Grande poêle antiadhésive ou sauteuse de 28 à 30 cm avec couvercle"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ."}, {"id": "r10", "name": "Spaghetti bolognaise rapide", "emoji": "🍝", "time": 40, "level": 1, "ingredients": ["500 g de spaghetti", "750 g de boeuf haché", "500 g de coulis de tomate", "1 oignon", "40 g de parmesan", "1 à 2 c. à soupe d’huile pour la cuisson", "Sel et poivre selon les goûts"], "steps": ["Émincer l’oignon. Porter une grande casserole d’eau salée à ébullition pendant que la sauce démarre.", "Dans une sauteuse, chauffer 1 cuillère à soupe d’huile à feu moyen. Faire revenir l’oignon 3 minutes, puis ajouter le bœuf et l’émietter à la spatule pendant 6 à 8 minutes. Si la viande forme une couche épaisse, la faire revenir en deux tournées, puis tout réunir avant de poursuivre.", "Verser le coulis et 5 cl d’eau. Laisser mijoter à feu doux 12 minutes en remuant de temps en temps. Goûter et rectifier le sel.", "Cuire les spaghetti pendant le temps du paquet, généralement 9 à 11 minutes. Garder un peu d’eau de cuisson puis égoutter.", "Servir pâtes, sauce et parmesan séparément. Si vous mélangez tout dans la poêle, ajouter 2 cuillères à soupe d’eau de cuisson pour assouplir la sauce. La viande hachée ou la saucisse doit être cuite à cœur : repère à la sonde, 75 °C pendant 30 secondes, sans se fier uniquement à la couleur."], "category": "Pâtes", "allergens": ["gluten", "lait"], "equipment": ["Grande poêle antiadhésive ou sauteuse de 28 à 30 cm avec couvercle", "Grande casserole"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ.", "safetySources": ["https://www.gov.uk/food-hygiene-businesses/cooking"]}, {"id": "r11", "name": "Tacos doux au boeuf", "emoji": "🌮", "time": 40, "level": 1, "ingredients": ["12 petites tortillas", "750 g de boeuf haché", "2 tomates", "1 avocat", "100 g de fromage râpé", "1 à 2 c. à soupe d’huile pour la cuisson", "1 pincée de paprika doux (facultatif)", "Sel et poivre selon les goûts"], "steps": ["Laver et couper les tomates en dés. Couper l’avocat et répartir les garnitures dans des bols, avec le fromage à part.", "Chauffer 1 cuillère à soupe d’huile à feu moyen. Ajouter le bœuf haché et une pincée de paprika doux ; émietter à la spatule.", "Cuire le bœuf 7 à 9 minutes en remuant, jusqu’à cuisson complète. Ajouter 2 cuillères à soupe d’eau si la viande devient sèche, puis goûter et saler légèrement. Si la viande forme une couche épaisse, la faire revenir en deux tournées, puis tout réunir avant de poursuivre.", "Réchauffer les tortillas dans une poêle sèche 20 à 30 secondes de chaque côté. Les conserver empilées sous un torchon propre.", "Chacun garnit ses tortillas de viande et des ingrédients qu’il souhaite. Prévoir une à deux tortillas par personne selon l’appétit. La viande hachée ou la saucisse doit être cuite à cœur : repère à la sonde, 75 °C pendant 30 secondes, sans se fier uniquement à la couleur."], "category": "À composer", "allergens": ["gluten", "lait"], "equipment": ["Grande poêle antiadhésive ou sauteuse de 28 à 30 cm avec couvercle"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ.", "safetySources": ["https://www.gov.uk/food-hygiene-businesses/cooking"]}, {"id": "r12", "name": "Poulet poêlé et grenailles", "emoji": "🍗", "time": 60, "level": 2, "ingredients": ["900 g d'aiguillettes de poulet", "1,2 kg de pommes de terre grenaille", "2 c. à soupe d'huile d'olive", "1 citron", "1 c. à café d'herbes", "Sel et poivre selon les goûts"], "steps": ["Laver les grenailles et les couper en deux, ou en quatre si elles sont grosses. Porter une casserole d’eau salée à ébullition.", "Cuire les pommes de terre dans l’eau 12 à 15 minutes, jusqu’à ce qu’une pointe de couteau entre facilement. Égoutter soigneusement.", "Pendant ce temps, chauffer la moitié de l’huile dans une grande poêle. Cuire les aiguillettes à feu moyen 8 à 10 minutes en les retournant, jusqu’à cuisson complète à cœur. Réserver sur une assiette propre. Faire deux tournées de poulet sans superposer les aiguillettes ; le temps vaut pour chaque tournée.", "Ajouter le reste d’huile puis les pommes de terre dans la poêle. Faire dorer 5 à 7 minutes en remuant ; procéder en deux tournées si nécessaire. Le temps vaut pour chaque tournée de pommes de terre.", "Remettre le poulet, ajouter le jus d’un demi-citron et les herbes. Chauffer 1 minute ; servir le reste du citron à table. Vérifier la volaille à cœur : 75 °C pendant 30 secondes avec une sonde propre ; les durées varient selon l’épaisseur."], "category": "Poulet", "allergens": [], "equipment": ["Grande poêle antiadhésive ou sauteuse de 28 à 30 cm avec couvercle", "Grande casserole"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ.", "safetySources": ["https://www.gov.uk/food-hygiene-businesses/cooking"]}, {"id": "r13", "name": "Risotto express aux champignons", "emoji": "🍚", "time": 50, "level": 2, "ingredients": ["450 g de riz à risotto", "500 g de champignons", "1 oignon", "1,3 l de bouillon", "60 g de parmesan", "1 à 2 c. à soupe d’huile pour la cuisson", "Sel et poivre selon les goûts"], "steps": ["Émincer l’oignon et les champignons. Chauffer le bouillon dans une casserole et le garder frémissant à côté de la sauteuse.", "Chauffer 1 cuillère à soupe d’huile à feu moyen. Faire revenir les champignons 8 à 10 minutes, jusqu’à évaporation de leur eau, puis l’oignon 3 minutes. Ajouter le riz cru et remuer 2 minutes.", "Verser une louche de bouillon chaud. Laisser absorber en remuant, puis ajouter une nouvelle louche. Continuer ainsi 18 à 22 minutes, à feu moyen doux.", "Goûter un grain : il doit être tendre avec une légère résistance. Si les 1,3 litre de bouillon est épuisé avant la fin, ajouter un peu d’eau chaude.", "Hors du feu, incorporer le parmesan selon les goûts. Couvrir 2 minutes puis servir ; réserver une portion sans fromage avant de l’ajouter."], "category": "Riz", "allergens": ["lait"], "equipment": ["Grande sauteuse antiadhésive de 4 à 5 l avec couvercle", "Grande casserole"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Le bouillon peut contenir du céleri, du gluten ou du lait. Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ."}, {"id": "r14", "name": "Pâtes au thon et tomate", "emoji": "🍝", "time": 30, "level": 1, "ingredients": ["500 g de pâtes", "400 g de thon en conserve (poids égoutté)", "400 g de coulis de tomate", "1 oignon", "1 c. à soupe d'huile", "Sel et poivre selon les goûts"], "steps": ["Émincer l’oignon et égoutter le thon. Porter une grande casserole d’eau salée à ébullition.", "Cuire les pâtes selon le temps du paquet. Avant d’égoutter, réserver une petite tasse d’eau de cuisson.", "Dans une poêle, chauffer l’huile à feu moyen. Faire revenir l’oignon 3 minutes. Ajouter le coulis et laisser frémir 5 à 7 minutes à feu doux.", "Ajouter le thon émietté et réchauffer doucement 2 à 3 minutes. Détendre la sauce avec un peu d’eau de cuisson si nécessaire.", "Goûter avant de saler car le thon est déjà salé. Servir les pâtes et la sauce séparément si cela convient mieux à la famille."], "category": "Pâtes", "allergens": ["gluten", "poisson"], "equipment": ["Grande poêle antiadhésive ou sauteuse de 28 à 30 cm avec couvercle", "Grande casserole"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ."}, {"id": "r15", "name": "Steak haché et purée", "emoji": "🥩", "time": 50, "level": 1, "ingredients": ["6 steaks hachés de 125 g chacun", "1,2 kg de pommes de terre", "25 cl de lait", "30 g de beurre", "Sel et poivre selon les goûts"], "steps": ["Éplucher les pommes de terre et les couper en cubes de 2 cm. Les mettre dans une casserole, couvrir d’eau froide et saler légèrement.", "Porter à ébullition puis cuire 18 à 22 minutes à petits bouillons. Vérifier avec un couteau : les morceaux doivent être très tendres.", "Égoutter puis écraser au presse-purée ou à la fourchette. Incorporer le beurre et le lait chaud en plusieurs fois pour obtenir la texture souhaitée.", "Chauffer une poêle à feu moyen vif. Cuire les steaks 4 à 6 minutes de chaque côté selon leur épaisseur ; pour les enfants, servir la viande hachée bien cuite à cœur. Prévoir deux tournées de trois portions dans une grande poêle ; ces durées s’appliquent à chaque tournée. Servir au fur et à mesure, ou utiliser deux poêles.", "Goûter la purée, rectifier l’assaisonnement et servir aussitôt. Si la poêle est petite, cuire les steaks en deux tournées. La viande hachée ou la saucisse doit être cuite à cœur : repère à la sonde, 75 °C pendant 30 secondes, sans se fier uniquement à la couleur."], "category": "Viande", "allergens": ["lait"], "equipment": ["Grande poêle antiadhésive ou sauteuse de 28 à 30 cm avec couvercle", "Grande casserole"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ.", "safetySources": ["https://www.gov.uk/food-hygiene-businesses/cooking"]}, {"id": "r16", "name": "Nouilles au poulet et sésame", "emoji": "🍜", "time": 40, "level": 2, "ingredients": ["500 g de nouilles de blé", "750 g de poulet", "2 carottes", "3 c. à soupe de sauce soja", "1 c. à soupe de graines de sésame", "1 à 2 c. à soupe d’huile pour la cuisson", "Sel et poivre selon les goûts"], "steps": ["Couper le poulet en fines lanières. Éplucher les carottes et les tailler en rubans fins à l’économe ou les râper.", "Cuire les nouilles selon le paquet, généralement 4 à 6 minutes. Réserver une petite tasse d’eau de cuisson puis égoutter.", "Chauffer 1 cuillère à soupe d’huile dans une grande poêle à feu moyen vif. Cuire le poulet 8 à 10 minutes en remuant jusqu’à cuisson complète à cœur. Procéder en deux tournées sans superposer les morceaux, avec la moitié de l’huile à chaque fois ; réunir ensuite le poulet cuit. La durée indiquée vaut pour chaque tournée.", "Ajouter les carottes et cuire 3 minutes. Incorporer les nouilles, la sauce soja et 2 cuillères à soupe d’eau de cuisson. Mélanger 1 à 2 minutes à feu moyen.", "Servir le sésame séparément. Vérifier les étiquettes de la sauce soja et des nouilles, notamment pour le gluten et les œufs. Vérifier la volaille à cœur : 75 °C pendant 30 secondes avec une sonde propre ; les durées varient selon l’épaisseur."], "category": "Riz", "allergens": ["gluten", "soja", "sésame"], "equipment": ["Grande poêle antiadhésive ou sauteuse de 28 à 30 cm avec couvercle", "Grande casserole"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Certaines nouilles contiennent aussi des œufs. Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ.", "safetySources": ["https://www.gov.uk/food-hygiene-businesses/cooking"]}, {"id": "r17", "name": "Ravioles fondantes à la sauteuse", "emoji": "🧀", "time": 35, "level": 1, "ingredients": ["1,2 kg de ravioles fraîches", "30 cl de crème", "150 g de fromage râpé", "200 g d'épinards facultatifs", "Sel et poivre selon les goûts"], "steps": ["Séparer délicatement les plaques de ravioles sans chercher à détacher chaque raviole. Si vous utilisez les épinards, les laver puis les faire tomber 2 minutes dans une sauteuse avec 2 cuillères à soupe d’eau. Diviser les ingrédients en deux et cuire deux tournées pour éviter d’entasser les ravioles ; servir au fur et à mesure. Si les épinards doivent rester à part, les réserver dans un bol après leur cuisson et avant la crème.", "Pour chaque tournée, verser 15 cl de crème et 15 cl d’eau dans une grande sauteuse antiadhésive. Porter à léger frémissement à feu moyen doux.", "Ajouter 600 g de ravioles par petites portions en les répartissant. Couvrir et cuire doucement 4 à 6 minutes, ou selon le paquet ; remuer très délicatement et ajouter un peu d’eau si elles accrochent.", "Vérifier qu’elles sont tendres, puis parsemer de la moitié du fromage. Couvrir 2 minutes à feu très doux, juste le temps qu’il fonde.", "Servir immédiatement. Cette version à la sauteuse est fondante et n’a pas de croûte gratinée ; garder les épinards à part si nécessaire."], "category": "Poêle", "allergens": ["gluten", "lait", "oeufs"], "equipment": ["Grande sauteuse antiadhésive de 4 à 5 l avec couvercle"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ."}, {"id": "r18", "name": "Saumon poêlé et riz", "emoji": "🐟", "time": 40, "level": 1, "ingredients": ["6 pavés de saumon de 125 à 150 g chacun", "400 g de riz", "1 citron", "2 c. à soupe d'huile d'olive", "Sel et poivre selon les goûts"], "steps": ["Rincer le riz si le paquet le recommande et le cuire dans une casserole selon ses indications, généralement 10 à 15 minutes. Couper le citron en quartiers.", "Éponger le saumon avec du papier absorbant. Chauffer l’huile dans une grande poêle à feu moyen ; déposer les pavés côté peau si elle est présente.", "Cuire 4 à 5 minutes sans déplacer les pavés. Baisser le feu, les retourner délicatement et cuire encore 3 à 5 minutes selon leur épaisseur. Prévoir deux tournées de trois portions dans une grande poêle ; ces durées s’appliquent à chaque tournée. Servir au fur et à mesure, ou utiliser deux poêles.", "Vérifier que le poisson est opaque au centre et se détache facilement. Si les pavés sont épais, couvrir 2 minutes supplémentaires à feu doux.", "Égoutter le riz et servir avec le saumon. Ajouter le citron dans les assiettes plutôt que dans la poêle pour laisser chacun choisir. Vérifier et retirer les arêtes avant de servir."], "category": "Poisson", "allergens": ["poisson"], "equipment": ["Grande poêle antiadhésive ou sauteuse de 28 à 30 cm avec couvercle", "Grande casserole"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ."}, {"id": "r19", "name": "Penne jambon et petits pois", "emoji": "🍝", "time": 30, "level": 1, "ingredients": ["500 g de penne", "250 g de dés de jambon", "200 g de petits pois", "15 cl de crème", "40 g de fromage râpé", "Sel et poivre selon les goûts"], "steps": ["Porter une grande casserole d’eau salée à ébullition. Préparer les dés de jambon et les petits pois ; les garder séparés si tout le monde ne souhaite pas en manger.", "Cuire les penne selon le paquet. Cuire les petits pois dans une petite casserole pendant la durée indiquée sur leur emballage, puis égoutter.", "Faire revenir le jambon 2 minutes dans une poêle à feu moyen doux. Verser la crème et chauffer 2 minutes sans forte ébullition.", "Réserver une tasse d’eau de cuisson puis égoutter les pâtes. Les mélanger avec la sauce et 2 cuillères à soupe de cette eau si nécessaire.", "Servir petits pois et fromage à part. Goûter avant de saler car le jambon et le fromage apportent déjà du sel. La crème et le jambon sont déjà incorporés ; réserver les pâtes nature avant mélange si nécessaire."], "category": "Pâtes", "allergens": ["gluten", "lait"], "equipment": ["Grande poêle antiadhésive ou sauteuse de 28 à 30 cm avec couvercle", "Grande casserole", "Petite casserole ou seconde poêle pour les garnitures séparées"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ."}, {"id": "r20", "name": "Burger maison à composer", "emoji": "🍔", "time": 45, "level": 2, "ingredients": ["6 pains burger", "6 steaks hachés de 125 g chacun", "6 tranches de cheddar", "2 tomates", "1 salade", "Sel et poivre selon les goûts"], "steps": ["Laver et couper les tomates et la salade. Disposer les garnitures et le cheddar sur la table dans des bols séparés.", "Chauffer une grande poêle à feu moyen vif. Cuire les steaks 4 à 6 minutes de chaque côté selon l’épaisseur ; la viande hachée destinée aux enfants doit être cuite à cœur. Prévoir deux tournées de trois portions dans une grande poêle ; ces durées s’appliquent à chaque tournée. Servir au fur et à mesure, ou utiliser deux poêles.", "Pour ceux qui veulent du cheddar, poser une tranche sur le steak en fin de cuisson et couvrir la poêle 1 minute à feu doux.", "Retirer la viande sur une assiette propre. Dorer les pains ouverts côté mie dans une autre poêle sèche, 1 à 2 minutes à feu moyen.", "Chacun assemble son burger avec les garnitures de son choix. Servir immédiatement pour garder les pains moelleux et la viande chaude. La viande hachée ou la saucisse doit être cuite à cœur : repère à la sonde, 75 °C pendant 30 secondes, sans se fier uniquement à la couleur."], "category": "À composer", "allergens": ["gluten", "lait"], "equipment": ["Grande poêle antiadhésive ou sauteuse de 28 à 30 cm avec couvercle"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Les pains peuvent également contenir du sésame, des œufs ou du soja. Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ.", "safetySources": ["https://www.gov.uk/food-hygiene-businesses/cooking"]}, {"id": "r21", "name": "Riz au lait de coco et poulet", "emoji": "🍛", "time": 40, "level": 2, "ingredients": ["400 g de riz", "750 g de poulet", "40 cl de lait de coco", "1 carotte", "1 c. à café de curry doux", "1 à 2 c. à soupe d’huile pour la cuisson", "Sel et poivre selon les goûts"], "steps": ["Couper le poulet en dés de 2 cm. Éplucher la carotte et la râper ou la couper en très fines rondelles pour qu’elle cuise rapidement.", "Cuire le riz dans une casserole selon les indications du paquet. Pendant ce temps, chauffer 1 cuillère à soupe d’huile dans une sauteuse à feu moyen.", "Faire revenir le poulet 5 minutes en remuant. Ajouter la carotte et le curry doux, puis cuire encore 2 minutes. Faire revenir le poulet en deux tournées si nécessaire, puis tout réunir avant la carotte.", "Verser le lait de coco et 10 cl d’eau. Couvrir et laisser frémir 10 à 12 minutes à feu doux, jusqu’à ce que le poulet soit cuit à cœur et la carotte tendre.", "Goûter et saler légèrement. Servir le riz et le poulet en sauce séparément ; ajouter un peu d’eau chaude si la sauce est trop épaisse. Vérifier la volaille à cœur : 75 °C pendant 30 secondes avec une sonde propre ; les durées varient selon l’épaisseur."], "category": "Poulet", "allergens": [], "equipment": ["Grande poêle antiadhésive ou sauteuse de 28 à 30 cm avec couvercle", "Grande casserole"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Le curry composé peut contenir de la moutarde ou du céleri. Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ.", "safetySources": ["https://www.gov.uk/food-hygiene-businesses/cooking"]}, {"id": "r22", "name": "Galettes de sarrasin jambon-oeuf", "emoji": "🥞", "time": 60, "level": 1, "ingredients": ["6 galettes de sarrasin", "6 oeufs", "6 tranches de jambon", "180 g de fromage râpé", "20 g de beurre pour la poêle", "Sel et poivre selon les goûts"], "steps": ["Préparer six portions de jambon et de fromage. Prévoir deux poêles si possible pour limiter l’attente ; sinon servir les galettes au fur et à mesure.", "Chauffer une poêle antiadhésive à feu moyen doux avec une petite noisette de beurre. Poser une galette et la réchauffer 30 secondes.", "Ajouter le jambon et le fromage au centre. Casser un œuf dessus et étaler doucement le blanc avec une spatule, sans percer le jaune.", "Replier les quatre bords. Couvrir et cuire 4 à 6 minutes à feu doux, jusqu’à ce que le blanc soit pris ; prolonger pour un jaune bien cuit. Pour les enfants, poursuivre jusqu’à ce que blanc et jaune soient pris ; compter jusqu’à 8 minutes par galette.", "Servir puis répéter pour les autres galettes. Le fromage peut être omis selon les goûts. Vérifier la composition des galettes pour les allergènes."], "category": "Express", "allergens": ["lait", "oeufs"], "equipment": ["Grande poêle antiadhésive ou sauteuse de 28 à 30 cm avec couvercle"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Choisir des galettes 100 % sarrasin si le gluten doit être évité et vérifier les traces ; certaines contiennent du blé. Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ."}, {"id": "r23", "name": "Chili doux et riz", "emoji": "🫘", "time": 40, "level": 2, "ingredients": ["400 g de riz", "450 g de boeuf haché", "500 g de haricots rouges en conserve (poids égoutté)", "400 g de tomates concassées", "1 oignon", "1 à 2 c. à soupe d’huile pour la cuisson", "1 pincée de paprika doux (facultatif)", "Sel et poivre selon les goûts"], "steps": ["Émincer l’oignon. Égoutter et rincer les haricots rouges. Lancer le riz dans une casserole selon les indications du paquet.", "Chauffer 1 cuillère à soupe d’huile dans une sauteuse à feu moyen. Faire revenir l’oignon 3 minutes.", "Ajouter le bœuf, l’émietter et le cuire 6 à 8 minutes jusqu’à cuisson complète. Ajouter une pincée de paprika doux si souhaité. Si la viande forme une couche épaisse, la faire revenir en deux tournées, puis tout réunir avant de poursuivre. Si nécessaire, réserver dès maintenant une portion de viande pour la cuire avec un peu de tomate dans une petite casserole, sans haricots.", "Verser les tomates, les haricots et 10 cl d’eau. Laisser mijoter 12 à 15 minutes à feu doux en remuant ; ajouter un peu d’eau si nécessaire.", "Goûter et saler légèrement. Pour une portion sans haricots, réserver de la viande cuite avec un peu de sauce dans une petite casserole avant d’ajouter les haricots, puis faire mijoter séparément. Servir avec le riz. La viande hachée ou la saucisse doit être cuite à cœur : repère à la sonde, 75 °C pendant 30 secondes, sans se fier uniquement à la couleur."], "category": "Viande", "allergens": [], "equipment": ["Grande poêle antiadhésive ou sauteuse de 28 à 30 cm avec couvercle", "Grande casserole"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ.", "safetySources": ["https://www.gov.uk/food-hygiene-businesses/cooking"]}, {"id": "r24", "name": "Poulet pané maison", "emoji": "🍗", "time": 50, "level": 2, "ingredients": ["900 g de filets de poulet", "2 oeufs", "120 g de chapelure", "1,2 kg de pommes de terre", "2 c. à soupe d'huile", "Sel et poivre selon les goûts"], "steps": ["Éplucher les pommes de terre, les couper en cubes de 2 cm et les cuire dans l’eau salée 18 à 20 minutes, jusqu’à tendreté. Pendant ce temps, couper le poulet en aiguillettes de 1 à 1,5 cm d’épaisseur.", "Battre les œufs dans une assiette creuse. Verser la chapelure dans une autre. Passer chaque aiguillette dans l’œuf puis dans la chapelure, en pressant légèrement.", "Chauffer l’huile à feu moyen dans une grande poêle. Déposer le poulet sans superposer les morceaux et cuire 4 à 5 minutes sur la première face.", "Retourner et cuire encore 4 à 5 minutes, davantage si les morceaux sont épais. Vérifier la cuisson complète au centre ; baisser le feu si la panure colore trop vite. Prévoir deux tournées de trois portions dans une grande poêle ; ces durées s’appliquent à chaque tournée. Servir au fur et à mesure, ou utiliser deux poêles.", "Égoutter les pommes de terre et servir avec le poulet croustillant. Jeter l’œuf et la chapelure ayant été en contact avec la viande crue. Vérifier la volaille à cœur : 75 °C pendant 30 secondes avec une sonde propre ; les durées varient selon l’épaisseur."], "category": "Poulet", "allergens": ["gluten", "oeufs"], "equipment": ["Grande poêle antiadhésive ou sauteuse de 28 à 30 cm avec couvercle", "Grande casserole"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ.", "safetySources": ["https://www.gov.uk/food-hygiene-businesses/cooking"]}, {"id": "r25", "name": "Pâtes ricotta citron", "emoji": "🍋", "time": 25, "level": 1, "ingredients": ["500 g de pâtes", "250 g de ricotta", "1 citron", "50 g de parmesan", "2 c. à soupe d'eau de cuisson", "Sel et poivre selon les goûts"], "steps": ["Laver le citron et prélever un peu de zeste. Mettre la ricotta dans un grand saladier ; garder le parmesan à part.", "Cuire les pâtes dans une grande casserole d’eau salée selon le temps du paquet. Avant d’égoutter, réserver une tasse d’eau de cuisson.", "Mélanger la ricotta, le zeste et 2 cuillères à soupe d’eau de cuisson chaude. Ajouter le jus de citron par petites quantités en goûtant.", "Verser les pâtes égouttées dans le saladier et mélanger hors du feu. Ajouter de l’eau de cuisson cuillère par cuillère jusqu’à obtenir une sauce souple.", "Servir immédiatement avec le parmesan à part. La ricotta fait partie de la sauce : prévoir un autre assaisonnement pour les personnes qui ne veulent aucun fromage."], "category": "Pâtes", "allergens": ["gluten", "lait"], "equipment": ["Grande poêle antiadhésive ou sauteuse de 28 à 30 cm avec couvercle", "Grande casserole"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ."}, {"id": "r26", "name": "Fajitas de poulet", "emoji": "🌯", "time": 50, "level": 2, "ingredients": ["12 petites tortillas", "750 g de poulet", "2 poivrons", "1 oignon", "250 g de yaourt nature", "1 à 2 c. à soupe d’huile pour la cuisson", "Sel et poivre selon les goûts"], "steps": ["Émincer l’oignon et les poivrons en fines lanières. Couper le poulet en bandes régulières. Préparer le yaourt dans un bol avec une pincée de sel.", "Chauffer 1 cuillère à soupe d’huile à feu moyen dans une grande poêle. Cuire oignon et poivrons 8 à 10 minutes avec 2 cuillères à soupe d’eau, jusqu’à ce qu’ils soient tendres. Réserver.", "Dans la même poêle, ajouter une cuillère à soupe d’huile si nécessaire et cuire le poulet 8 à 10 minutes en remuant, jusqu’à cuisson complète à cœur. Procéder en deux tournées sans superposer les morceaux, avec la moitié de l’huile à chaque fois ; réunir ensuite le poulet cuit. La durée indiquée vaut pour chaque tournée.", "Réchauffer les tortillas dans une poêle sèche 20 à 30 secondes de chaque côté. Garder les légumes séparés du poulet pour permettre le choix.", "Servir les garnitures et le yaourt dans des bols. Chacun garnit puis roule sa tortilla ; prévoir une à deux tortillas par personne selon l’appétit. Vérifier la volaille à cœur : 75 °C pendant 30 secondes avec une sonde propre ; les durées varient selon l’épaisseur."], "category": "À composer", "allergens": ["gluten", "lait"], "equipment": ["Grande poêle antiadhésive ou sauteuse de 28 à 30 cm avec couvercle"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ.", "safetySources": ["https://www.gov.uk/food-hygiene-businesses/cooking"]}, {"id": "r27", "name": "Coquillettes au jambon", "emoji": "🧀", "time": 25, "level": 1, "ingredients": ["500 g de coquillettes", "250 g de jambon", "25 g de beurre", "120 g de fromage râpé", "Sel et poivre selon les goûts"], "steps": ["Couper le jambon en petits dés. Porter une grande casserole d’eau salée à ébullition et préparer le beurre et le fromage.", "Verser les coquillettes et cuire pendant le temps du paquet, généralement 7 à 10 minutes, en remuant au départ pour éviter qu’elles collent.", "Prélever une petite tasse d’eau de cuisson, puis égoutter les pâtes. Les remettre dans la casserole chaude, hors du feu.", "Ajouter le beurre et 2 cuillères à soupe d’eau de cuisson. Mélanger, puis incorporer le jambon et réchauffer 1 minute à feu doux si nécessaire.", "Servir le fromage séparément. Goûter avant d’ajouter du sel, le jambon étant déjà salé."], "category": "Express", "allergens": ["gluten", "lait"], "equipment": ["Grande poêle antiadhésive ou sauteuse de 28 à 30 cm avec couvercle", "Grande casserole"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ."}, {"id": "r28", "name": "Quiche sans pâte à la poêle", "emoji": "🥧", "time": 60, "level": 2, "ingredients": ["12 œufs", "200 g de lardons", "20 cl de crème", "3 tomates", "Sel et poivre selon les goûts"], "steps": ["Laver les tomates et les couper en quartiers pour les servir à part. Battre les œufs et la crème dans un saladier avec un peu de poivre ; saler peu, les lardons étant déjà salés.", "Faire revenir les lardons dans une grande poêle antiadhésive 5 à 7 minutes à feu moyen, jusqu’à cuisson complète. Égoutter l’excès de graisse en en laissant un peu dans la poêle. Diviser ensuite lardons et mélange œufs-crème en deux pour cuire deux quiches successivement dans une poêle de 24 à 28 cm.", "Baisser le feu et verser la moitié du mélange œufs-crème sur la moitié des lardons. Répartir les lardons avec une spatule, couvrir et cuire 12 à 16 minutes à feu très doux.", "Vérifier que le centre est pris en inclinant légèrement la poêle. Si le dessus reste liquide, couvrir et prolonger 2 à 3 minutes à feu doux.", "Laisser reposer 3 minutes hors du feu, puis couper en trois et servir avec les tomates. Répéter la cuisson pour les trois autres portions avec le reste des ingrédients ; deux poêles permettent de tout cuire ensemble."], "category": "Poêle", "allergens": ["lait", "oeufs"], "equipment": ["Grande poêle antiadhésive ou sauteuse de 28 à 30 cm avec couvercle"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ."}, {"id": "r29", "name": "Poulet teriyaki doux", "emoji": "🍱", "time": 40, "level": 2, "ingredients": ["750 g de poulet", "400 g de riz", "3 c. à soupe de sauce soja", "2 c. à soupe de miel", "1 carotte", "1 à 2 c. à soupe d’huile pour la cuisson", "Sel et poivre selon les goûts"], "steps": ["Couper le poulet en morceaux de 2 cm. Râper la carotte et la garder dans un bol. Lancer le riz dans une casserole selon les indications du paquet.", "Mélanger la sauce soja, le miel et 5 cuillères à soupe d’eau dans un petit bol.", "Chauffer 1 cuillère à soupe d’huile dans une poêle à feu moyen. Cuire le poulet 8 à 10 minutes en le retournant, jusqu’à cuisson complète à cœur. Procéder en deux tournées sans superposer les morceaux, avec la moitié de l’huile à chaque fois ; réunir ensuite le poulet cuit. La durée indiquée vaut pour chaque tournée.", "Baisser le feu et verser la sauce. Laisser frémir 2 à 3 minutes en remuant pour enrober le poulet ; ajouter une cuillère d’eau si elle épaissit trop vite.", "Servir sur le riz, avec la carotte râpée séparément. Ne pas saler avant de goûter, la sauce soja étant déjà très salée. Vérifier la volaille à cœur : 75 °C pendant 30 secondes avec une sonde propre ; les durées varient selon l’épaisseur."], "category": "Poulet", "allergens": ["gluten", "soja"], "equipment": ["Grande poêle antiadhésive ou sauteuse de 28 à 30 cm avec couvercle", "Grande casserole"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ.", "safetySources": ["https://www.gov.uk/food-hygiene-businesses/cooking"]}, {"id": "r30", "name": "Oeufs brouillés et tartines", "emoji": "🍳", "time": 40, "level": 1, "ingredients": ["12 oeufs", "12 tranches de pain", "25 g de beurre", "200 g de tomates cerises", "Sel et poivre selon les goûts"], "steps": ["Laver et couper les tomates cerises en quatre dans la longueur. Battre les œufs dans un saladier avec une petite pincée de sel.", "Dorer les tranches de pain dans une poêle sèche à feu moyen, 1 à 2 minutes par face. Réserver sous un torchon propre. Compter six tournées de deux tranches dans une poêle ordinaire, soit 12 à 24 minutes pour tout le pain ; une grande poêle peut en contenir davantage.", "Faire fondre le beurre dans une grande poêle à feu doux. Ajouter les œufs et remuer lentement avec une spatule en raclant le fond.", "Cuire 5 à 8 minutes, jusqu’à obtenir des œufs pris et moelleux. Pour les enfants, poursuivre jusqu’à ce qu’il ne reste plus de partie liquide.", "Retirer aussitôt du feu et répartir dans les assiettes. Servir avec les tartines et les tomates à part pour éviter de détremper le pain."], "category": "Express", "allergens": ["gluten", "lait", "oeufs"], "equipment": ["Grande poêle antiadhésive ou sauteuse de 28 à 30 cm avec couvercle"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ."}, {"id": "r31", "name": "Lasagnes express à la poêle", "emoji": "🍝", "time": 45, "level": 2, "ingredients": ["500 g de feuilles de lasagnes fraîches", "500 g de boeuf haché", "500 g de sauce tomate", "200 g de mozzarella", "1 oignon", "1 à 2 c. à soupe d’huile pour la cuisson", "Sel et poivre selon les goûts"], "steps": ["Émincer l’oignon. Couper les feuilles de lasagnes fraîches en morceaux de 4 à 5 cm et la mozzarella en petits dés.", "Chauffer 1 cuillère à soupe d’huile dans une grande sauteuse à feu moyen. Faire revenir l’oignon 3 minutes, puis le bœuf 6 à 8 minutes en l’émiettant. Si la viande forme une couche épaisse, la faire revenir en deux tournées, puis tout réunir avant de poursuivre.", "Ajouter la sauce tomate et 40 cl d’eau chaude. À frémissement, répartir les morceaux de lasagnes dans la sauce en les séparant bien.", "Couvrir et cuire 12 à 18 minutes à feu doux, selon le paquet. Remuer délicatement toutes les 3 minutes ; ajouter un peu d’eau chaude si les pâtes absorbent trop de liquide.", "Quand les pâtes sont tendres, ajouter la mozzarella et couvrir 2 minutes hors du feu pour la faire fondre. Réserver d’abord une portion sans fromage si nécessaire. La viande hachée ou la saucisse doit être cuite à cœur : repère à la sonde, 75 °C pendant 30 secondes, sans se fier uniquement à la couleur."], "category": "Pâtes", "allergens": ["gluten", "lait", "oeufs"], "equipment": ["Grande sauteuse antiadhésive de 4 à 5 l avec couvercle", "Grande casserole"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ.", "safetySources": ["https://www.gov.uk/food-hygiene-businesses/cooking"]}, {"id": "r32", "name": "Pizza tortilla à la poêle", "emoji": "🍕", "time": 55, "level": 1, "ingredients": ["6 grandes tortillas", "300 g de sauce tomate", "250 g de mozzarella", "200 g de jambon", "1 c. à café d'origan", "Sel et poivre selon les goûts"], "steps": ["Couper le jambon et la mozzarella en petits morceaux. Égoutter la mozzarella. Prévoir une poêle antiadhésive avec un couvercle.", "Placer une tortilla dans la poêle froide. Étaler une fine couche de sauce tomate, en laissant le bord libre, puis répartir une petite portion de jambon, de mozzarella et d’origan.", "Chauffer à feu très doux, couvrir et cuire 4 à 6 minutes. Soulever le bord après 2 minutes pour vérifier qu’il ne brûle pas.", "Lorsque le fromage est fondu, enlever le couvercle et laisser 30 secondes à 1 minute pour raffermir le dessous. Faire glisser sur une assiette.", "Préparer les autres tortillas de la même manière et servir au fur et à mesure. Une fine garniture permet au fromage de fondre avant que la base colore trop."], "category": "Poêle", "allergens": ["gluten", "lait"], "equipment": ["Grande poêle antiadhésive ou sauteuse de 28 à 30 cm avec couvercle"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ."}, {"id": "r33", "name": "Riz cantonais simplifié", "emoji": "🍚", "time": 40, "level": 1, "ingredients": ["1,2 kg de riz déjà cuit (environ 400 g cru)", "6 œufs", "250 g de dés de jambon", "250 g de petits pois", "3 c. à soupe de sauce soja", "1 à 2 c. à soupe d’huile pour la cuisson", "Sel et poivre selon les goûts"], "steps": ["Utiliser du riz refroidi idéalement en moins d’une heure, puis réfrigéré et consommé sous 24 heures ; ne le réchauffer qu’une fois. La préparation du riz n’est pas incluse. Diviser tous les ingrédients en deux pour réaliser deux tournées. Détacher les grains et battre les œufs.", "Chauffer la moitié de l’huile dans une grande poêle à feu moyen. Verser la moitié des œufs battus, remuer 1 à 2 minutes jusqu’à ce qu’ils soient pris, puis réserver.", "Ajouter la moitié du jambon et des petits pois. Cuire 4 à 5 minutes ; si les petits pois sont surgelés, prolonger selon le paquet avec 2 cuillères à soupe d’eau. Pour garder les petits pois à part, les cuire séparément dans une casserole selon le paquet au lieu de les mélanger au jambon.", "Ajouter 600 g de riz et faire sauter 4 à 5 minutes en mélangeant, jusqu’à ce qu’il soit fumant partout. Incorporer les œufs et la moitié de la sauce soja.", "Chauffer encore 1 minute et servir immédiatement. Garder les petits pois à part si certains n’en veulent pas. Répéter pour la seconde moitié des ingrédients et servir au fur et à mesure."], "category": "Riz", "allergens": ["gluten", "oeufs", "soja"], "equipment": ["Grande poêle antiadhésive ou sauteuse de 28 à 30 cm avec couvercle", "Grande casserole"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ.", "safetySources": ["https://www.gov.uk/government/publications/home-food-fact-checker/home-food-fact-checker"]}, {"id": "r34", "name": "Pommes de terre fondantes et jambon", "emoji": "🥔", "time": 50, "level": 2, "ingredients": ["1,2 kg de pommes de terre", "25 cl de crème", "200 g de jambon", "1 gousse d'ail", "70 g de fromage râpé", "Sel et poivre selon les goûts"], "steps": ["Éplucher les pommes de terre et les couper en rondelles de 3 mm. Écraser la gousse d’ail. Préparer une grande sauteuse avec un couvercle.", "Verser la crème et 30 cl d’eau dans la sauteuse, ajouter l’ail et une pincée de sel. Porter doucement à frémissement.", "Ajouter les rondelles de pommes de terre, couvrir et cuire 22 à 28 minutes à feu doux. Remuer délicatement toutes les 5 minutes et ajouter un peu d’eau si le fond accroche.", "Piquer plusieurs rondelles : elles doivent être fondantes. Réserver une portion nature avant les garnitures si nécessaire. Ajouter le jambon en morceaux, réchauffer 2 minutes, puis parsemer de fromage et couvrir 2 minutes hors du feu.", "Servir chaud. Pour proposer jambon et fromage à part, ne pas les incorporer à l’étape précédente : réchauffer le jambon séparément et présenter le fromage dans un bol. La crème reste présente dans les pommes de terre."], "category": "Poêle", "allergens": ["lait"], "equipment": ["Grande sauteuse antiadhésive de 4 à 5 l avec couvercle"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ."}, {"id": "r35", "name": "Sandwich club chaud au poulet", "emoji": "🥪", "time": 40, "level": 1, "ingredients": ["12 tranches de pain de mie", "600 g de poulet cuit", "2 tomates", "100 g de fromage frais", "1 salade", "Sel et poivre selon les goûts"], "steps": ["Utiliser du poulet déjà cuit, conservé au réfrigérateur. L’émincer. Laver les tomates et la salade, puis les couper et bien essorer la salade. Utiliser un reste réfrigéré rapidement, datant de moins de 48 heures, ou respecter la date et les consignes du produit ; le poulet ne sera réchauffé qu’une fois.", "Dorer le pain de mie dans une poêle sèche 1 à 2 minutes par face à feu moyen. Procéder en plusieurs tournées. Compter six tournées de deux tranches dans une poêle ordinaire, soit 12 à 24 minutes pour tout le pain ; une grande poêle peut en contenir davantage.", "Réchauffer le poulet dans une poêle avec 2 cuillères à soupe d’eau pendant 6 à 8 minutes, jusqu’à ce qu’il soit bien chaud à cœur.", "Tartiner le pain de fromage frais. Ajouter le poulet, puis les tomates et la salade selon les goûts ; refermer avec une seconde tranche.", "Couper en triangles et servir immédiatement. Le poulet et le fromage frais peuvent être servis séparément pour composer les sandwiches à table."], "category": "Express", "allergens": ["gluten", "lait"], "equipment": ["Grande poêle antiadhésive ou sauteuse de 28 à 30 cm avec couvercle"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ."}, {"id": "r36", "name": "Saucisses et lentilles express", "emoji": "🥘", "time": 40, "level": 1, "ingredients": ["6 saucisses fraîches de porc de 100 à 125 g chacune", "1,2 kg de lentilles cuites (poids égoutté)", "1 carotte", "1 oignon", "20 cl de bouillon", "1 à 2 c. à soupe d’huile pour la cuisson", "Sel et poivre selon les goûts"], "steps": ["Émincer l’oignon et couper la carotte en très petits dés. Égoutter et rincer les lentilles déjà cuites.", "Chauffer 1 cuillère à soupe d’huile dans une sauteuse à feu moyen. Dorer les saucisses 5 minutes en les retournant.", "Ajouter l’oignon et la carotte, faire revenir 3 minutes, puis verser le bouillon. Couvrir et laisser frémir 12 à 15 minutes.", "Vérifier la cuisson à cœur des saucisses selon leur emballage. Ajouter les lentilles et réchauffer 5 minutes à feu doux ; ajouter un peu d’eau si nécessaire.", "Goûter avant de saler. Servir les saucisses et les lentilles séparément si cela convient mieux à la famille. La viande hachée ou la saucisse doit être cuite à cœur : repère à la sonde, 75 °C pendant 30 secondes, sans se fier uniquement à la couleur."], "category": "Viande", "allergens": [], "equipment": ["Grande poêle antiadhésive ou sauteuse de 28 à 30 cm avec couvercle", "Grande casserole"], "ovenRequired": false, "photo": null, "photoSource": "", "photoTitle": "", "servings": 6, "portionNote": "Quantités pour 6 portions familiales ; ajuster selon les âges et les appétits.", "timeNote": "Durée totale indicative, préparation comprise, avec une grande poêle et une casserole utilisées en parallèle si nécessaire. Les tournées sont incluses ; une petite poêle peut rallonger la durée.", "allergenNote": "Vérifier les saucisses et le bouillon : céleri, gluten, lait, moutarde ou autres allergènes possibles selon la recette. Allergènes principaux indiqués pour les ingrédients proposés. Vérifier chaque emballage (pain, pâtes, sauces, charcuterie, bouillon notamment) et les traces. Une garniture retirée après mélange ne rend pas le plat sûr en cas d’allergie ; utiliser des ingrédients et ustensiles adaptés dès le départ.", "safetySources": ["https://www.gov.uk/food-hygiene-businesses/cooking"]}, {"id": "r37", "name": "Pâtes au saumon fumé", "emoji": "🍝", "time": 30, "level": 1, "ingredients": ["500 g de pâtes", "200 g de saumon fumé", "20 cl de crème", "1 citron", "1 pincée d'aneth", "Sel et poivre selon les goûts"], "steps": ["Couper le saumon fumé en lanières. Laver le citron et préparer quelques gouttes de jus. Lancer une grande casserole d’eau salée.", "Cuire les pâtes selon le temps du paquet. Réserver une tasse d’eau de cuisson avant de les égoutter.", "Dans une poêle à feu doux, réchauffer la crème avec l’aneth pendant 2 à 3 minutes sans la faire bouillir fortement.", "Ajouter les pâtes et 2 cuillères à soupe d’eau de cuisson. Incorporer le saumon fumé et poursuivre à feu doux en mélangeant, jusqu’à ce qu’il soit bien c
